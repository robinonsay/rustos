<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1240" width="720" height="1240" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The RP2350 memory map as link.ld uses it: flash from 0x10000000 holds the vector table, the IMAGE_DEF block, code, read-only data and the load image of .data; SRAM from 0x20000000 holds .data, any alignment gap, .bss, an 8 kB stack reservation and the stack growing down from 0x20082000</title>
  <defs>
    <marker id="m02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1240" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">Where link.ld puts everything</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Not to scale; high addresses at the top; 0x10000124 as in the shipping build.</text>
  <text x="24" y="80" font-size="14" fill="#4b5563">rustos master 80bf599, firmware/pico2/link.ld</text>

  <!-- column headers -->
  <text x="242" y="116" text-anchor="middle" font-weight="bold">FLASH (XIP)</text>
  <text x="242" y="136" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x10000000, 4M</text>
  <text x="602" y="116" text-anchor="middle" font-weight="bold">RAM (SRAM)</text>
  <text x="602" y="136" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x20000000, 520K</text>

  <!-- ================= FLASH column ================= -->
  <!-- free -->
  <rect x="148" y="156" width="188" height="192" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="242" y="248" text-anchor="middle" font-size="14" fill="#4b5563">unused flash</text>
  <text x="242" y="268" text-anchor="middle" font-size="14" fill="#4b5563">to the end of 4 MB</text>
  <!-- .data load image -->
  <rect x="148" y="348" width="188" height="52" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="242" y="370" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.data image</text>
  <text x="242" y="390" text-anchor="middle" font-size="14">initial values (LMA)</text>
  <!-- .rodata -->
  <rect x="148" y="400" width="188" height="52" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="242" y="422" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.rodata</text>
  <text x="242" y="442" text-anchor="middle" font-size="14">constants, strings</text>
  <!-- .text -->
  <rect x="148" y="452" width="188" height="144" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="242" y="516" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.text</text>
  <text x="242" y="538" text-anchor="middle" font-size="14">code, run in place</text>
  <!-- .boot_info -->
  <rect x="148" y="596" width="188" height="52" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="242" y="618" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.boot_info</text>
  <text x="242" y="638" text-anchor="middle" font-size="14">IMAGE_DEF, 20 bytes</text>
  <!-- .vector_table -->
  <rect x="148" y="648" width="188" height="68" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="242" y="676" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.vector_table</text>
  <text x="242" y="698" text-anchor="middle" font-size="14">68 words, 272 bytes</text>

  <!-- FLASH address labels -->
  <g font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" text-anchor="end">
    <text x="140" y="161">0x10400000</text>
    <text x="140" y="405">__sidata</text>
    <text x="140" y="601">0x10000124</text>
    <text x="140" y="653">0x10000110</text>
    <text x="140" y="721">0x10000000</text>
  </g>

  <!-- ================= RAM column ================= -->
  <!-- core 0 stack -->
  <rect x="508" y="156" width="188" height="96" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="602" y="182" text-anchor="middle" font-size="14" font-weight="bold">core 0 stack (MSP)</text>
  <text x="602" y="204" text-anchor="middle" font-size="14">grows down</text>
  <text x="602" y="226" text-anchor="middle" font-size="14">rustos sets no MSPLIM</text>
  <!-- free -->
  <rect x="508" y="252" width="188" height="96" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="602" y="296" text-anchor="middle" font-size="14" fill="#4b5563">free RAM</text>
  <text x="602" y="316" text-anchor="middle" font-size="14" fill="#4b5563">(no heap)</text>
  <!-- .stack reservation -->
  <rect x="508" y="348" width="188" height="64" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="602" y="374" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.stack, 8 kB</text>
  <text x="602" y="396" text-anchor="middle" font-size="14">reservation only</text>
  <!-- .bss -->
  <rect x="508" y="412" width="188" height="208" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="602" y="436" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.bss</text>
  <text x="602" y="456" text-anchor="middle" font-size="14">zeroed by reset_bss:</text>
  <text x="602" y="474" text-anchor="middle" font-size="14">board singleton flag,</text>
  <text x="602" y="492" text-anchor="middle" font-size="14">driver statics,</text>
  <text x="602" y="510" text-anchor="middle" font-size="14">16 kB ADC ring if used</text>
  <rect x="520" y="524" width="164" height="80" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="602" y="546" text-anchor="middle" font-size="14" font-weight="bold">core 1 stack</text>
  <text x="602" y="566" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Core1Stack</text>
  <text x="602" y="586" text-anchor="middle" font-size="14">(PR #6, a static)</text>
  <!-- alignment gap -->
  <rect x="508" y="620" width="188" height="36" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="602" y="643" text-anchor="middle" font-size="14" fill="#4b5563">alignment gap, often 0</text>
  <!-- .data -->
  <rect x="508" y="656" width="188" height="60" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="602" y="680" text-anchor="middle" font-size="16" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">.data</text>
  <text x="602" y="702" text-anchor="middle" font-size="14">mutable statics (VMA)</text>

  <!-- RAM address labels -->
  <g font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" text-anchor="end">
    <text x="500" y="161">0x20082000</text>
    <text x="500" y="179">_stack_top</text>
    <text x="500" y="417">__ebss</text>
    <text x="500" y="625">__sbss</text>
    <text x="500" y="661">__edata</text>
    <text x="500" y="721">0x20000000</text>
    <text x="500" y="739">__sdata</text>
  </g>

  <!-- copy arrow: .data image (flash) to .data (RAM) -->
  <path d="M336,374 L352,374 L352,686 L508,686" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#m02-arrow)"/>
  <text x="362" y="510" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">reset_data</text>
  <text x="362" y="530" font-size="14">copies it</text>
  <text x="362" y="550" font-size="14">at every boot</text>

  <!-- ================= SRAM banks ================= -->
  <text x="24" y="784" font-weight="bold">The RAM region is ten SRAM banks</text>
  <rect x="24" y="796" width="162" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="105" y="820" text-anchor="middle" font-size="14" font-weight="bold">SRAM0-3</text>
  <text x="105" y="842" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x20000000</text>
  <text x="105" y="864" text-anchor="middle" font-size="14">256 kB, striped</text>
  <rect x="194" y="796" width="162" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="275" y="820" text-anchor="middle" font-size="14" font-weight="bold">SRAM4-7</text>
  <text x="275" y="842" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x20040000</text>
  <text x="275" y="864" text-anchor="middle" font-size="14">256 kB, striped</text>
  <rect x="364" y="796" width="162" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="445" y="820" text-anchor="middle" font-size="14" font-weight="bold">SRAM8</text>
  <text x="445" y="842" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x20080000</text>
  <text x="445" y="864" text-anchor="middle" font-size="14">4 kB, not striped</text>
  <rect x="534" y="796" width="162" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="615" y="820" text-anchor="middle" font-size="14" font-weight="bold">SRAM9</text>
  <text x="615" y="842" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x20081000</text>
  <text x="615" y="864" text-anchor="middle" font-size="14">4 kB, not striped</text>
  <text x="24" y="902" font-size="14" fill="#4b5563">Core 0's stack starts at the top of SRAM9. SRAM_END = 0x20082000 is unmapped;</text>
  <text x="24" y="922" font-size="14" fill="#4b5563">the stack is full-descending, so the first push writes 0x20081FFC.</text>

  <!-- ================= rest of the address space ================= -->
  <text x="24" y="966" font-weight="bold">The rest of the address space rustos touches</text>
  <rect x="24" y="978" width="672" height="196" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <g font-size="14">
    <text x="40" y="1004" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x00000000</text><text x="148" y="1004">Boot ROM, 32 kB: the bootrom</text>
    <text x="40" y="1030" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x10000000</text><text x="148" y="1030">XIP: the flash chip, read in place (FLASH above)</text>
    <text x="40" y="1056" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x20000000</text><text x="148" y="1056">SRAM, 520 kB (RAM above)</text>
    <text x="40" y="1082" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x40000000</text><text x="148" y="1082">APB peripherals: RESETS, CLOCKS, IO_BANK0, TIMER0, ...</text>
    <text x="40" y="1108" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0x50000000</text><text x="148" y="1108">AHB peripherals: DMA, USB controller and its RAM</text>
    <text x="40" y="1134" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0xd0000000</text><text x="148" y="1134">SIO: GPIO set and clear; inter-core FIFOs and CPUID (PR #6)</text>
    <text x="40" y="1160" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0xe0000000</text><text x="148" y="1160">Cortex-M33 private block: CPACR, VTOR, SysTick</text>
  </g>

  <!-- legend -->
  <rect x="24" y="1198" width="18" height="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="50" y="1210" font-size="14">placed by link.ld</text>
  <rect x="184" y="1198" width="18" height="14" fill="#ffffff" stroke="#374151" stroke-width="2"/><text x="210" y="1210" font-size="14">free or unused</text>
  <rect x="330" y="1198" width="18" height="14" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><text x="356" y="1210" font-size="14">chip memory</text>
  <rect x="460" y="1198" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="4 3"/><text x="486" y="1210" font-size="14">PR #6, not on master yet</text>
</svg>
