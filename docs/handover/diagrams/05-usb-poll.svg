<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1680" width="720" height="1680" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The USB driver's hardware side: the DPRAM layout with its fixed area and this driver's 64-byte buffers; one buffer handed to the controller with AVAILABLE set last and taken back only once the controller has cleared AVAILABLE, although it sets the BUFF_STATUS bit first; and the six steps of one poll</title>
  <defs>
    <marker id="u05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1680" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">USB driver: DPRAM, one buffer handoff, one poll</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Rp2350Usb, polled, no interrupts (rustos 80bf599, usb/mod.rs and usb/hw.rs)</text>

  <!-- 1. DPRAM -->
  <text x="24" y="94" font-size="14" font-weight="bold" fill="#374151">1. The DPRAM: 4 kB at 0x5010_0000, shared with the controller</text>
  <g font-size="14">
    <rect x="24" y="106" width="672" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <rect x="24" y="136" width="672" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <rect x="24" y="166" width="672" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <rect x="24" y="196" width="672" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <rect x="24" y="226" width="672" height="30" fill="#f3f4f6" stroke="#92400e" stroke-width="1"/>
    <rect x="24" y="256" width="672" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <rect x="24" y="286" width="672" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <rect x="24" y="316" width="672" height="30" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
    <rect x="24" y="346" width="672" height="30" fill="#f3f4f6" stroke="#92400e" stroke-width="1"/>
    <line x1="24" y1="256" x2="696" y2="256" stroke="#92400e" stroke-width="3"/>
    <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
      <text x="36" y="126">0x000</text><text x="148" y="126">setup_packet</text>
      <text x="36" y="156">0x008</text><text x="148" y="156">ep_ctrl[15]</text>
      <text x="36" y="186">0x080</text><text x="148" y="186">buf_ctrl[16]</text>
      <text x="36" y="216">0x100</text><text x="148" y="216">ep0_buf</text>
      <text x="36" y="246" fill="#4b5563">0x140</text><text x="148" y="246" fill="#4b5563">_ep0_buf1</text>
      <text x="36" y="276">0x180</text><text x="148" y="276">ep1_in_buf</text>
      <text x="36" y="306">0x1c0</text><text x="148" y="306">ep2_out_buf</text>
      <text x="36" y="336">0x200</text><text x="148" y="336">ep2_in_buf</text>
      <text x="36" y="366" fill="#4b5563">0x240</text><text x="148" y="366" fill="#4b5563">_free</text>
    </g>
    <text x="300" y="126">the last SETUP packet, 8 bytes</text>
    <text x="300" y="156">endpoint control words, EP1-EP15</text>
    <text x="300" y="186">buffer control words, EP0-EP15, IN and OUT</text>
    <text x="300" y="216">EP0, 64 bytes, both directions</text>
    <text x="300" y="246" fill="#4b5563">EP0's second buffer: reserved, never used</text>
    <text x="300" y="276">EP1 IN (notifications): never armed, NAKs</text>
    <text x="300" y="306">EP2 OUT: bytes from the host</text>
    <text x="300" y="336">EP2 IN: bytes to the host</text>
    <text x="300" y="366" fill="#4b5563">to 0xfff: unused</text>
  </g>
  <g font-size="14" fill="#4b5563">
    <text x="24" y="400">Above the thick line the datasheet fixes the layout; below it the buffers are this</text>
    <text x="24" y="420">driver's choice, each 64-byte aligned (the controller ignores an offset's low six bits).</text>
    <text x="24" y="440">No atomic set or clear aliases here: every change is a plain read or write.</text>
  </g>

  <!-- 2. handoff -->
  <text x="24" y="480" font-size="14" font-weight="bold" fill="#374151">2. Handing one buffer to the controller, and taking it back</text>

  <rect x="40" y="492" width="180" height="56" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="130" y="515" text-anchor="middle" font-weight="bold">Driver</text>
  <text x="130" y="537" text-anchor="middle" font-size="14">pico2::usb, clk_sys</text>
  <rect x="310" y="492" width="220" height="56" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="420" y="515" text-anchor="middle" font-weight="bold">USB controller</text>
  <text x="420" y="537" text-anchor="middle" font-size="14">and DPRAM, clk_usb</text>
  <rect x="580" y="492" width="116" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="638" y="526" text-anchor="middle" font-weight="bold">Host</text>

  <line x1="130" y1="548" x2="130" y2="598" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="130" y1="642" x2="130" y2="930" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="130" y1="1026" x2="130" y2="1040" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="420" y1="548" x2="420" y2="764" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="420" y1="810" x2="420" y2="826" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="420" y1="872" x2="420" y2="1040" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="638" y1="548" x2="638" y2="1040" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="275" y="574" text-anchor="middle" font-size="14">length and PID, AVAILABLE = 0</text>
  <line x1="130" y1="582" x2="418" y2="582" stroke="#374151" stroke-width="2" marker-end="url(#u05-arrow)"/>

  <rect x="50" y="598" width="160" height="44" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <text x="130" y="616" text-anchor="middle" font-size="14">dsb, then 8 nops:</text>
  <text x="130" y="634" text-anchor="middle" font-size="14">≥ 1 clk_usb cycle</text>

  <text x="275" y="664" text-anchor="middle" font-size="14">same word with AVAILABLE = 1:</text>
  <text x="275" y="682" text-anchor="middle" font-size="14">the controller owns the buffer</text>
  <line x1="130" y1="690" x2="418" y2="690" stroke="#374151" stroke-width="2" marker-end="url(#u05-arrow)"/>

  <text x="529" y="736" text-anchor="middle" font-size="14">IN or OUT transaction</text>
  <line x1="422" y1="744" x2="636" y2="744" stroke="#374151" stroke-width="2" marker-start="url(#u05-arrow)" marker-end="url(#u05-arrow)"/>

  <rect x="310" y="764" width="220" height="46" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="420" y="783" text-anchor="middle" font-size="14">step 3: sets the endpoint's</text>
  <text x="420" y="801" text-anchor="middle" font-size="14">bit in BUFF_STATUS</text>
  <rect x="310" y="826" width="220" height="46" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="420" y="845" text-anchor="middle" font-size="14">step 4: writes back length</text>
  <text x="420" y="863" text-anchor="middle" font-size="14">and PID, clears AVAILABLE</text>

  <text x="150" y="808" font-size="14" fill="#991b1b">a poll here can see</text>
  <text x="150" y="826" font-size="14" fill="#991b1b">the bit before step 4</text>

  <text x="275" y="904" text-anchor="middle" font-size="14">poll: BUFF_STATUS, then the word</text>
  <line x1="130" y1="912" x2="418" y2="912" stroke="#374151" stroke-width="2" marker-end="url(#u05-arrow)"/>

  <rect x="32" y="930" width="276" height="96" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/>
  <g font-size="14">
    <text x="44" y="952"><tspan font-weight="bold">AVAILABLE still 1:</tspan> leave the</text>
    <text x="44" y="972">bit set and look again next poll.</text>
    <text x="44" y="996"><tspan font-weight="bold">AVAILABLE 0:</tspan> clear the bit</text>
    <text x="44" y="1016">and take the completion.</text>
  </g>

  <!-- 3. poll -->
  <text x="24" y="1076" font-size="14" font-weight="bold" fill="#374151">3. poll(): six steps, in this order, at least once per millisecond</text>

  <g font-size="14">
    <rect x="24" y="1090" width="672" height="54" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="40" y="1112" font-size="16" font-weight="bold">1. <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">track_bus_state</tspan></text>
    <text x="40" y="1133">suspend and connect latches, then levels: any change counts a LinkEvent</text>

    <rect x="24" y="1170" width="672" height="54" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="40" y="1192" font-size="16" font-weight="bold">2. <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bus_reset</tspan>, if SIE_STATUS.BUS_RESET</text>
    <text x="40" y="1213">address 0, control words zeroed, both rings emptied, LinkEvent::BusReset</text>

    <rect x="24" y="1250" width="672" height="54" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="40" y="1272" font-size="16" font-weight="bold">3. <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">handle_buffers</tspan>, before any SETUP</text>
    <text x="40" y="1293">each completion only once AVAILABLE reads 0; EP0 IN before EP0 OUT</text>

    <rect x="24" y="1330" width="672" height="54" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="40" y="1352" font-size="16" font-weight="bold">4. <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">handle_setup</tspan>, if SIE_STATUS.SETUP_REC</text>
    <text x="40" y="1373">clear the flag, read 8 bytes, revoke EP0, run ControlHandler::setup's action</text>

    <rect x="24" y="1410" width="672" height="54" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="40" y="1432" font-size="16" font-weight="bold">5. <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">service_rx</tspan></text>
    <text x="40" y="1453">arm EP2 OUT if configured, not halted, and 64 bytes free in the receive ring</text>

    <rect x="24" y="1490" width="672" height="54" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="40" y="1512" font-size="16" font-weight="bold">6. <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">service_tx</tspan></text>
    <text x="40" y="1533">arm EP2 IN: the pending packet, or up to 64 bytes from the transmit ring</text>
  </g>
  <line x1="360" y1="1144" x2="360" y2="1168" stroke="#374151" stroke-width="2" marker-end="url(#u05-arrow)"/>
  <line x1="360" y1="1224" x2="360" y2="1248" stroke="#374151" stroke-width="2" marker-end="url(#u05-arrow)"/>
  <line x1="360" y1="1304" x2="360" y2="1328" stroke="#374151" stroke-width="2" marker-end="url(#u05-arrow)"/>
  <line x1="360" y1="1384" x2="360" y2="1408" stroke="#374151" stroke-width="2" marker-end="url(#u05-arrow)"/>
  <line x1="360" y1="1464" x2="360" y2="1488" stroke="#374151" stroke-width="2" marker-end="url(#u05-arrow)"/>

  <g font-size="14" fill="#4b5563">
    <text x="24" y="1574">Between polls: write() arms EP2 IN at once if it is idle, and read() re-arms</text>
    <text x="24" y="1594">EP2 OUT as soon as it frees room for a whole packet.</text>
  </g>

  <!-- legend -->
  <text x="24" y="1640" font-size="14" font-weight="bold">Legend</text>
  <rect x="90" y="1628" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="114" y="1640" font-size="14">rustos firmware</text>
  <rect x="236" y="1628" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="260" y="1640" font-size="14">chip hardware</text>
  <rect x="374" y="1628" width="18" height="14" fill="#f3f4f6" stroke="#374151"/><text x="398" y="1640" font-size="14">host, or unused</text>
  <text x="90" y="1664" font-size="14" fill="#991b1b">red text: the race the driver guards against</text>
</svg>
