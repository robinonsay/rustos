<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1076" width="720" height="1076" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>How ownership works: Rp2350::take() succeeds once per boot and yields device and pin handles; driver constructors and pin factories consume them by move, giving one driver and one typed pin each, checked by the compiler</title>
  <defs>
    <marker id="o01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1076" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="bold">How ownership works in rustos</text>
  <text x="24" y="58" font-size="14" fill="#4b5563">One run-time claim per boot. After it, the compiler tracks every handle.</text>

  <!-- 1: run time -->
  <text x="24" y="94" font-size="14" font-weight="bold" fill="#4b5563">1. Checked at run time, once per boot</text>
  <rect x="24" y="106" width="672" height="90" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="360" y="134" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350::take() -&gt; Option&lt;Rp2350&gt;</text>
  <text x="360" y="158" text-anchor="middle" font-size="14">one <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">compare_exchange(false, true)</tspan> on the static <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">BOARD_TAKEN</tspan></text>
  <text x="360" y="180" text-anchor="middle" font-size="14">first call: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Some(board)</tspan>; every later call, on either core: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">None</tspan></text>

  <line x1="580" y1="196" x2="580" y2="260" stroke="#374151" stroke-width="2" marker-end="url(#o01-arrow)"/>
  <text x="592" y="233" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Some(board)</text>

  <!-- 2: compile time -->
  <text x="24" y="236" font-size="14" font-weight="bold" fill="#4b5563">2. Checked by the compiler from here on</text>
  <rect x="24" y="262" width="672" height="184" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="288"><tspan font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">board: Rp2350</tspan><tspan dx="10" font-size="14" fill="#4b5563">each field is moved out once</tspan></text>

  <rect x="40" y="302" width="240" height="130" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="160" y="326" text-anchor="middle" font-weight="bold">Device handles (9)</text>
  <text x="160" y="350" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">board.gpio</text>
  <text x="160" y="370" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DeviceHandle&lt;Rp2350Gpio&gt;</text>
  <text x="160" y="396" text-anchor="middle" font-size="14">and clocks, timer, systick,</text>
  <text x="160" y="416" text-anchor="middle" font-size="14">watchdog, usb, pwm, dma, adc</text>

  <rect x="440" y="302" width="240" height="130" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="560" y="326" text-anchor="middle" font-weight="bold">Pin handles (30)</text>
  <text x="560" y="350" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">board.pins.led</text>
  <text x="560" y="370" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PinHandle&lt;25&gt;</text>
  <text x="560" y="396" text-anchor="middle" font-size="14">one per pin the Pico 2 has</text>
  <text x="560" y="416" text-anchor="middle" font-size="14">(0-29); no <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PinHandle&lt;40&gt;</tspan></text>

  <!-- moves into constructors -->
  <line x1="160" y1="432" x2="160" y2="504" stroke="#374151" stroke-width="2" marker-end="url(#o01-arrow)"/>
  <text x="172" y="478" font-size="14">moved in</text>
  <line x1="560" y1="432" x2="560" y2="504" stroke="#374151" stroke-width="2" marker-end="url(#o01-arrow)"/>
  <text x="572" y="478" font-size="14">moved in</text>

  <rect x="24" y="506" width="272" height="114" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="160" y="532" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Gpio::new(board.gpio)</text>
  <text x="160" y="556" text-anchor="middle" font-size="14">takes the GPIO blocks out of reset</text>
  <text x="160" y="578" text-anchor="middle" font-size="14">returns Self, not Option:</text>
  <text x="160" y="600" text-anchor="middle" font-size="14">a second call does not compile</text>

  <rect x="424" y="506" width="272" height="114" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="560" y="532" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">gpio.output_from_handle(</text>
  <text x="560" y="552" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">board.pins.led) -&gt; Result</text>
  <text x="560" y="578" text-anchor="middle" font-size="14">drives the pin low, then hands</text>
  <text x="560" y="600" text-anchor="middle" font-size="14">it to SIO as a push-pull output</text>

  <!-- results -->
  <line x1="160" y1="620" x2="160" y2="664" stroke="#374151" stroke-width="2" marker-end="url(#o01-arrow)"/>
  <text x="172" y="647" font-size="14">returns</text>
  <line x1="560" y1="620" x2="560" y2="664" stroke="#374151" stroke-width="2" marker-end="url(#o01-arrow)"/>
  <text x="572" y="647" font-size="14">returns Ok(pin)</text>

  <rect x="24" y="666" width="272" height="118" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="160" y="692" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Gpio</text>
  <text x="160" y="716" text-anchor="middle" font-size="14">one driver per boot; needs no</text>
  <text x="160" y="738" text-anchor="middle" font-size="14">clocks, so the keyer builds it</text>
  <text x="160" y="760" text-anchor="middle" font-size="14">first and opens its key line</text>

  <!-- the driver, borrowed mutably, makes the pin -->
  <path d="M296,725 H360 V563 H422" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#o01-arrow)"/>
  <text x="360" y="550" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&amp;mut gpio</text>

  <rect x="424" y="666" width="272" height="118" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="560" y="692" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350GpioOut&lt;25&gt;</text>
  <text x="560" y="716" text-anchor="middle" font-size="14">the pin number is in the type</text>
  <text x="560" y="738" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">impl Write&lt;bool&gt;</text>
  <text x="560" y="760" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">write(): Error = Infallible</text>

  <!-- 3: not checked by the compiler -->
  <text x="24" y="826" font-size="14" font-weight="bold" fill="#4b5563">3. Not checked by the compiler</text>
  <rect x="24" y="840" width="328" height="156" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="40" y="866" font-weight="bold">Still checked at run time</text>
  <text x="40" y="890" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PwmError::ChannelInUse</text>
  <text x="40" y="910" font-size="14">GPIO n and n+16 share one PWM output</text>
  <text x="40" y="934" font-size="14">PWM frequency, ADC sample-rate ranges</text>
  <text x="40" y="956" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">AdcError::NotReady</text>
  <text x="40" y="978" font-size="14">a second <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">take()</tspan> returns <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">None</tspan></text>

  <rect x="368" y="840" width="328" height="156" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="384" y="866" font-weight="bold">Unsafe: the caller's promise</text>
  <text x="384" y="890" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">unsafe PinHandle::new()</text>
  <text x="384" y="910" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">unsafe DeviceHandle::new()</text>
  <text x="384" y="930" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">unsafe Rp2350Pwm::silence_all()</text>
  <text x="384" y="956" font-size="14">raw register writes in unsafe blocks</text>

  <text x="24" y="1022" font-size="14" fill="#4b5563">Limit: nothing gives a handle back, so a pin is never reconfigured in safe code.</text>

  <!-- legend -->
  <text x="24" y="1058" font-size="14" font-weight="bold">Legend</text>
  <rect x="88" y="1046" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="112" y="1058" font-size="14">rustos code (firmware)</text>
  <rect x="300" y="1046" width="18" height="14" fill="#ffffff" stroke="#374151"/><text x="324" y="1058" font-size="14">note: what the types do not cover</text>
</svg>
