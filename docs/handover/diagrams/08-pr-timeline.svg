<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 918" width="720" height="918" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Timeline of rustos PRs #1 to #6, each beside the cw-message-gateway change that first used it: #1 for PR #11, #2 for PR #15, #3 for PR #16, #4 for PR #24, #5 for PR #30 and #6 for PR #31</title>
  <defs>
    <marker id="c08t-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="918" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">rustos PRs and the gateway changes that used them</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Time runs down; each arrow points to the gateway change that first pinned that PR</text>

  <!-- column headers -->
  <text x="24" y="96" font-size="14" font-weight="bold" fill="#4b5563">Merged</text>
  <text x="96" y="96" font-size="14" font-weight="bold" fill="#4b5563">rustos PR: what it added</text>
  <text x="480" y="96" font-size="14" font-weight="bold" fill="#4b5563">cw-message-gateway change</text>

  <!-- row 1: #1 -> PR #11 -->
  <text x="24" y="138" font-size="14" font-weight="bold">Oct 6</text>
  <rect x="84" y="112" width="348" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="138" font-weight="bold">#1 Clocks, timer, watchdog, USB</text>
  <text x="96" y="158" font-size="14">USB serial; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::usb</tspan> with 35 host tests</text>
  <text x="96" y="178" font-size="14" fill="#4b5563">merged as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">cfc2b14</tspan></text>
  <text x="96" y="198" font-size="14" fill="#4b5563">ran on a Pico 2; not yet: timeout, link loss</text>
  <line x1="432" y1="162" x2="464" y2="162" stroke="#374151" stroke-width="2" marker-end="url(#c08t-arrow)"/>
  <rect x="468" y="112" width="228" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="480" y="138" font-weight="bold">PR #11 keyer box</text>
  <text x="480" y="158" font-size="14">USB serial to hfnode,</text>
  <text x="480" y="178" font-size="14">GP16 key, 500 ms watchdog</text>
  <text x="480" y="198" font-size="14" fill="#4b5563">merged as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">2e39996</tspan></text>

  <!-- row 2: #2 -> PR #15 -->
  <text x="24" y="254" font-size="14" font-weight="bold">Oct 8</text>
  <rect x="84" y="228" width="348" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="254" font-weight="bold">#2 PWM square waves</text>
  <text x="96" y="274" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">silence_all</tspan> skips a block in reset</text>
  <text x="96" y="294" font-size="14" fill="#4b5563">merged as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">fcde02e</tspan></text>
  <text x="96" y="314" font-size="14" fill="#4b5563">bring-up ran (inferred); no tone played yet</text>
  <line x1="432" y1="278" x2="464" y2="278" stroke="#374151" stroke-width="2" marker-end="url(#c08t-arrow)"/>
  <rect x="468" y="228" width="228" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="480" y="254" font-weight="bold">PR #15 handheld</text>
  <text x="480" y="274" font-size="14">PTT on GP17,</text>
  <text x="480" y="294" font-size="14">MCW tone on GP18</text>
  <text x="480" y="314" font-size="14" fill="#4b5563">on main via <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">eef8c12</tspan></text>

  <!-- row 3: #3 -> PR #16 -->
  <text x="24" y="370" font-size="14" font-weight="bold">Oct 8</text>
  <rect x="84" y="344" width="348" height="140" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="370" font-weight="bold">#3 For audit KB-5, KB-7, KB-9</text>
  <text x="96" y="390" font-size="14">timer <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DBGPAUSE</tspan> = 0 and SysTick (KB-5)</text>
  <text x="96" y="410" font-size="14">watchdog scratch registers (KB-7)</text>
  <text x="96" y="430" font-size="14">fault safe state in <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">entry!</tspan> (KB-9)</text>
  <text x="96" y="450" font-size="14" fill="#4b5563">merged as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">5fc0c2d</tspan></text>
  <text x="96" y="470" font-size="14" fill="#4b5563">writes ran (inferred); no fault yet</text>
  <line x1="432" y1="414" x2="464" y2="414" stroke="#374151" stroke-width="2" marker-end="url(#c08t-arrow)"/>
  <rect x="468" y="344" width="228" height="140" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="480" y="370" font-weight="bold">PR #16 audit fixes</text>
  <text x="480" y="390" font-size="14">ClockCheck, latched trips,</text>
  <text x="480" y="410" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">safe_state</tspan> on a fault,</text>
  <text x="480" y="430" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">check_faults.py</tspan> in CI</text>
  <text x="480" y="450" font-size="14" fill="#4b5563">on main via <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">eef8c12</tspan></text>

  <!-- row 4: #4 -> PR #24 -->
  <text x="24" y="526" font-size="14" font-weight="bold">Oct 9</text>
  <rect x="84" y="500" width="348" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="526" font-weight="bold">#4 Template manifest renamed</text>
  <text x="96" y="546" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Cargo.toml.liquid</tspan>; no driver change</text>
  <text x="96" y="566" font-size="14">ends a spurious cargo error message</text>
  <text x="96" y="586" font-size="14" fill="#4b5563">merged as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">8c91507</tspan></text>
  <line x1="432" y1="550" x2="464" y2="550" stroke="#374151" stroke-width="2" marker-end="url(#c08t-arrow)"/>
  <rect x="468" y="500" width="228" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="480" y="526" font-weight="bold">PR #24 pin bump</text>
  <text x="480" y="546" font-size="14">same UF2 when built with</text>
  <text x="480" y="566" font-size="14">build id <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">eef8c126</tspan></text>
  <text x="480" y="586" font-size="14" fill="#4b5563">merged as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">76f35d1</tspan></text>

  <!-- row 5: #5 -> PR #30 (open) -->
  <text x="24" y="642" font-size="14" font-weight="bold">Oct 11</text>
  <rect x="84" y="616" width="348" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="642" font-weight="bold">#5 ADC and DMA ring</text>
  <text x="96" y="662" font-size="14">one ADC pin into an 8192-sample ring</text>
  <text x="96" y="682" font-size="14" fill="#4b5563">merged as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">80bf599</tspan>, master today</text>
  <text x="96" y="702" font-size="14" fill="#4b5563">not run on hardware</text>
  <line x1="432" y1="666" x2="464" y2="666" stroke="#374151" stroke-width="2" marker-end="url(#c08t-arrow)"/>
  <rect x="468" y="616" width="228" height="100" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="642" font-weight="bold">PR #30 decoder box</text>
  <text x="480" y="662" font-size="14">decodes Morse from radio</text>
  <text x="480" y="682" font-size="14">audio on GP26 at 32 kHz</text>
  <text x="480" y="702" font-size="14" fill="#4b5563">open, at <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">3efaf84</tspan></text>

  <!-- row 6: #6 (open) -> PR #31 (draft) -->
  <text x="24" y="758" font-size="14" font-weight="bold">not yet</text>
  <rect x="84" y="732" width="348" height="120" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="96" y="758" font-weight="bold">#6 Multicore and room()</text>
  <text x="96" y="778" font-size="14">core 1 on its own stack, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MSPLIM</tspan>, FPU</text>
  <text x="96" y="798" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Usb::room()</tspan> for the keyer</text>
  <text x="96" y="818" font-size="14" fill="#4b5563">open, head <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">410dffa</tspan></text>
  <text x="96" y="838" font-size="14" fill="#4b5563">not run on hardware</text>
  <line x1="432" y1="792" x2="464" y2="792" stroke="#374151" stroke-width="2" marker-end="url(#c08t-arrow)"/>
  <rect x="468" y="732" width="228" height="120" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="758" font-weight="bold">PR #31 one-Pico image</text>
  <text x="480" y="778" font-size="14">keyer on core 0,</text>
  <text x="480" y="798" font-size="14">decoder on core 1;</text>
  <text x="480" y="818" font-size="14">uses all ten drivers</text>
  <text x="480" y="838" font-size="14" fill="#4b5563">draft, at <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bc5062a</tspan></text>

  <!-- legend -->
  <text x="24" y="892" font-size="14" font-weight="bold">Legend</text>
  <rect x="88" y="880" width="18" height="14" fill="#dcfce7" stroke="#166534"/>
  <text x="112" y="892" font-size="14">firmware change, merged</text>
  <rect x="300" y="880" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/>
  <text x="324" y="892" font-size="14">open PR, not merged yet</text>
</svg>
