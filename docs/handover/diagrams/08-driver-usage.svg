<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 652" width="720" height="652" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>A matrix of the ten rustos drivers against the three firmware images: the keyer box on main uses clocks, timer, SysTick, watchdog with scratch, USB, GPIO and PWM; the decoder box on PR #30 uses clocks, timer, watchdog, USB, GPIO, ADC and DMA; the one-Pico image on PR #31 uses all ten, plus Rp2350Usb::room</title>
  <rect x="0" y="0" width="720" height="652" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">Which rustos drivers each firmware image uses</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">A dot means the image constructs that driver; a dash means it does not</text>
  <rect x="268" y="76" width="136" height="484" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <rect x="412" y="76" width="136" height="484" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="556" y="76" width="136" height="484" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="20" y="518" width="236" height="36" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="336" y="100" text-anchor="middle" font-weight="bold">Keyer box</text>
  <text x="336" y="120" text-anchor="middle" font-size="14">gateway main</text>
  <text x="336" y="140" text-anchor="middle" font-size="14" fill="#4b5563">rustos <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">8c91507</tspan></text>
  <text x="480" y="100" text-anchor="middle" font-weight="bold">Decoder box</text>
  <text x="480" y="120" text-anchor="middle" font-size="14">PR #30, open</text>
  <text x="480" y="140" text-anchor="middle" font-size="14" fill="#4b5563">rustos <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">80bf599</tspan></text>
  <text x="624" y="100" text-anchor="middle" font-weight="bold">One-Pico</text>
  <text x="624" y="120" text-anchor="middle" font-size="14">PR #31, draft</text>
  <text x="624" y="140" text-anchor="middle" font-size="14" fill="#4b5563">rustos <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">410dffa</tspan></text>
  <text x="28" y="140" font-size="14" font-weight="bold" fill="#4b5563">Driver</text>
  <text x="164" y="140" font-size="14" font-weight="bold" fill="#4b5563">Added by</text>
  <line x1="20" y1="152" x2="692" y2="152" stroke="#374151" stroke-width="2"/>
  <text x="28" y="181" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">gpio</text>
  <text x="164" y="181" font-size="14">before #1</text>
  <circle cx="336" cy="176" r="7" fill="#111827"/>
  <circle cx="480" cy="176" r="7" fill="#111827"/>
  <circle cx="624" cy="176" r="7" fill="#111827"/>
  <line x1="20" y1="196" x2="692" y2="196" stroke="#374151" stroke-width="1" stroke-opacity="0.25"/>
  <text x="28" y="221" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">clocks</text>
  <text x="164" y="221" font-size="14">#1, #5</text>
  <circle cx="336" cy="216" r="7" fill="#111827"/>
  <circle cx="480" cy="216" r="7" fill="#111827"/>
  <circle cx="624" cy="216" r="7" fill="#111827"/>
  <line x1="20" y1="236" x2="692" y2="236" stroke="#374151" stroke-width="1" stroke-opacity="0.25"/>
  <text x="28" y="261" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">timer</text>
  <text x="164" y="261" font-size="14">#1, #3</text>
  <circle cx="336" cy="256" r="7" fill="#111827"/>
  <circle cx="480" cy="256" r="7" fill="#111827"/>
  <circle cx="624" cy="256" r="7" fill="#111827"/>
  <line x1="20" y1="276" x2="692" y2="276" stroke="#374151" stroke-width="1" stroke-opacity="0.25"/>
  <text x="28" y="301" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">systick</text>
  <text x="164" y="301" font-size="14">#3</text>
  <circle cx="336" cy="296" r="7" fill="#111827"/>
  <line x1="472" y1="296" x2="488" y2="296" stroke="#4b5563" stroke-width="2"/>
  <circle cx="624" cy="296" r="7" fill="#111827"/>
  <line x1="20" y1="316" x2="692" y2="316" stroke="#374151" stroke-width="1" stroke-opacity="0.25"/>
  <text x="28" y="341" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">watchdog</text>
  <text x="164" y="341" font-size="14">#1, #3</text>
  <circle cx="304" cy="336" r="7" fill="#111827"/>
  <text x="318" y="341" font-size="14">scratch</text>
  <circle cx="436" cy="336" r="7" fill="#111827"/>
  <text x="450" y="341" font-size="14">no scratch</text>
  <circle cx="592" cy="336" r="7" fill="#111827"/>
  <text x="606" y="341" font-size="14">scratch</text>
  <line x1="20" y1="356" x2="692" y2="356" stroke="#374151" stroke-width="1" stroke-opacity="0.25"/>
  <text x="28" y="381" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">usb</text>
  <text x="164" y="381" font-size="14">#1, #6</text>
  <circle cx="336" cy="376" r="7" fill="#111827"/>
  <circle cx="480" cy="376" r="7" fill="#111827"/>
  <circle cx="588" cy="376" r="7" fill="#111827"/>
  <text x="602" y="381" font-size="14">+ <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">room()</tspan></text>
  <line x1="20" y1="396" x2="692" y2="396" stroke="#374151" stroke-width="1" stroke-opacity="0.25"/>
  <text x="28" y="421" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">pwm</text>
  <text x="164" y="421" font-size="14">#2</text>
  <circle cx="336" cy="416" r="7" fill="#111827"/>
  <line x1="472" y1="416" x2="488" y2="416" stroke="#4b5563" stroke-width="2"/>
  <circle cx="624" cy="416" r="7" fill="#111827"/>
  <line x1="20" y1="436" x2="692" y2="436" stroke="#374151" stroke-width="1" stroke-opacity="0.25"/>
  <text x="28" y="461" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">dma</text>
  <text x="164" y="461" font-size="14">#5</text>
  <line x1="328" y1="456" x2="344" y2="456" stroke="#4b5563" stroke-width="2"/>
  <circle cx="480" cy="456" r="7" fill="#111827"/>
  <circle cx="624" cy="456" r="7" fill="#111827"/>
  <line x1="20" y1="476" x2="692" y2="476" stroke="#374151" stroke-width="1" stroke-opacity="0.25"/>
  <text x="28" y="501" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">adc</text>
  <text x="164" y="501" font-size="14">#5</text>
  <line x1="328" y1="496" x2="344" y2="496" stroke="#4b5563" stroke-width="2"/>
  <circle cx="480" cy="496" r="7" fill="#111827"/>
  <circle cx="624" cy="496" r="7" fill="#111827"/>
  <text x="28" y="541" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">multicore</text>
  <text x="164" y="541" font-size="14">#6</text>
  <line x1="328" y1="536" x2="344" y2="536" stroke="#4b5563" stroke-width="2"/>
  <line x1="472" y1="536" x2="488" y2="536" stroke="#4b5563" stroke-width="2"/>
  <circle cx="624" cy="536" r="7" fill="#111827"/>
  <text x="24" y="594" font-size="14" font-weight="bold">Legend</text>
  <circle cx="97" cy="589" r="7" fill="#111827"/>
  <text x="112" y="594" font-size="14">image constructs the driver</text>
  <line x1="320" y1="589" x2="336" y2="589" stroke="#4b5563" stroke-width="2"/>
  <text x="346" y="594" font-size="14">image does not use it</text>
  <rect x="88" y="610" width="18" height="14" fill="#dcfce7" stroke="#166534"/>
  <text x="112" y="622" font-size="14">on main</text>
  <rect x="320" y="610" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/>
  <text x="346" y="622" font-size="14">on an open PR (image or driver)</text>
</svg>
