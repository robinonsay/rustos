<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1158" width="720" height="1158" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>A PWM slice: clk_sys through the divider drives a counter from 0 to TOP and the pin is high while the counter is below CC; write(true) and write(false) take effect at the next wrap, so a tone starts and stops on whole cycles; off is CC = 0 with the slice running, never a stopped slice</title>
  <defs>
    <marker id="p05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="p05-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#166534"/>
    </marker>
    <marker id="p05-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#991b1b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1158" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">PWM square wave: whole-cycle switching, off by CC = 0</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">One slice drives the keyer box's tone pin GP18 at 700 Hz (rustos 80bf599)</text>

  <!-- 1. the slice -->
  <text x="24" y="88" font-size="14" font-weight="bold" fill="#374151">1. One slice of the PWM block (12 slices, each with channels A and B)</text>

  <rect x="24" y="98" width="116" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="82" y="122" text-anchor="middle" font-weight="bold">clk_sys</text>
  <text x="82" y="146" text-anchor="middle" font-size="14">150 MHz</text>
  <text x="82" y="168" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CLK_SYS_HZ</text>

  <rect x="163" y="98" width="116" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="221" y="122" text-anchor="middle" font-weight="bold">Divider</text>
  <text x="221" y="146" text-anchor="middle" font-size="14">DIV = d / 16</text>
  <text x="221" y="168" text-anchor="middle" font-size="14">16 ≤ d ≤ 4095</text>

  <rect x="302" y="98" width="116" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="122" text-anchor="middle" font-weight="bold">Counter</text>
  <text x="360" y="146" text-anchor="middle" font-size="14">CTR: 0 to TOP</text>
  <text x="360" y="168" text-anchor="middle" font-size="14">then wraps to 0</text>

  <rect x="441" y="98" width="116" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="499" y="122" text-anchor="middle" font-weight="bold">Compare</text>
  <text x="499" y="146" text-anchor="middle" font-size="14">pin high while</text>
  <text x="499" y="168" text-anchor="middle" font-size="14">CTR &lt; CC</text>

  <rect x="580" y="98" width="116" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="638" y="122" text-anchor="middle" font-weight="bold">GP18</text>
  <text x="638" y="146" text-anchor="middle" font-size="14">slice 1, A</text>
  <text x="638" y="168" text-anchor="middle" font-size="14">FUNCSEL 4</text>

  <line x1="140" y1="140" x2="161" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#p05-arrow)"/>
  <line x1="279" y1="140" x2="300" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#p05-arrow)"/>
  <line x1="418" y1="140" x2="439" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#p05-arrow)"/>
  <line x1="557" y1="140" x2="578" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#p05-arrow)"/>

  <rect x="24" y="202" width="672" height="100" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="44" y="226" font-weight="bold">The keyer box's 700 Hz tone, as rustos computes it</text>
  <text x="44" y="250" font-size="14">for_frequency(150 MHz, 700): d = 53 (DIV 3 + 5/16), h = 32 345, TOP = 2h − 1 = 64 689</text>
  <text x="44" y="270" font-size="14">Period: (TOP + 1) × DIV = 64 690 counts × 3.3125 = 214 286 cycles = 1.43 ms</text>
  <text x="44" y="290" font-size="14">On: CC = h (high for counts 0 to h − 1, low for h to TOP). Off: CC = 0, always low.</text>

  <!-- 2. switching -->
  <text x="24" y="334" font-size="14" font-weight="bold" fill="#374151">2. Switching a tone on and off: five periods</text>

  <line x1="80" y1="356" x2="110" y2="356" stroke="#374151" stroke-width="2"/>
  <text x="116" y="361" font-size="14">counter CTR</text>
  <line x1="236" y1="356" x2="266" y2="356" stroke="#166534" stroke-width="3"/>
  <text x="272" y="361" font-size="14">CC in use</text>
  <line x1="380" y1="356" x2="410" y2="356" stroke="#111827" stroke-width="3"/>
  <text x="416" y="361" font-size="14">pin GP18</text>

  <!-- guides at the two wraps that matter -->
  <line x1="200" y1="396" x2="200" y2="618" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="560" y1="396" x2="560" y2="618" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- events -->
  <text x="140" y="382" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#166534">write(true)</text>
  <line x1="140" y1="388" x2="140" y2="458" stroke="#166534" stroke-width="2" marker-end="url(#p05-arrow-green)"/>
  <text x="470" y="382" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#166534">write(false)</text>
  <line x1="470" y1="388" x2="470" y2="458" stroke="#166534" stroke-width="2" marker-end="url(#p05-arrow-green)"/>

  <!-- axis labels -->
  <text x="72" y="413" text-anchor="end" font-size="14" fill="#4b5563">TOP</text>
  <text x="72" y="473" text-anchor="end" font-size="14" fill="#4b5563">h</text>
  <text x="72" y="533" text-anchor="end" font-size="14" fill="#4b5563">0</text>
  <line x1="80" y1="528" x2="680" y2="528" stroke="#d1d5db" stroke-width="1"/>

  <!-- counter sawtooth -->
  <path d="M80,528 L200,408 L200,528 L320,408 L320,528 L440,408 L440,528 L560,408 L560,528 L680,408" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- CC in use -->
  <path d="M80,528 L200,528 L200,468 L560,468 L560,528 L680,528" fill="none" stroke="#166534" stroke-width="3"/>

  <g font-size="14" fill="#4b5563" text-anchor="middle">
    <text x="140" y="552">period 1</text>
    <text x="260" y="552">period 2</text>
    <text x="380" y="552">period 3</text>
    <text x="500" y="552">period 4</text>
    <text x="620" y="552">period 5</text>
  </g>

  <!-- pin output -->
  <text x="72" y="579" text-anchor="end" font-size="14" fill="#4b5563">high</text>
  <text x="72" y="615" text-anchor="end" font-size="14" fill="#4b5563">low</text>
  <path d="M80,610 L200,610 L200,574 L260,574 L260,610 L320,610 L320,574 L380,574 L380,610 L440,610 L440,574 L500,574 L500,610 L680,610" fill="none" stroke="#111827" stroke-width="3"/>

  <text x="200" y="640" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">tone on from this wrap</text>
  <text x="560" y="640" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">tone off from this wrap</text>

  <g font-size="14" fill="#4b5563">
    <text x="24" y="670">CC is double-buffered: software writes a copy, and the output takes it at the next wrap</text>
    <text x="24" y="690">(§12.5.2.3). A tone starts with a full high half and stops after a full low half, so a</text>
    <text x="24" y="710">keyed element lasts a whole number of periods: 1.43 ms each at 700 Hz.</text>
  </g>

  <!-- 3. off -->
  <text x="24" y="746" font-size="14" font-weight="bold" fill="#374151">3. Off means CC = 0 with the slice running, never a stopped slice</text>

  <text x="24" y="766" font-size="14" fill="#4b5563">Lines as in 2: grey counter CTR, green CC in use, black pin GP18.</text>

  <rect x="24" y="780" width="328" height="248" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="44" y="806" font-weight="bold" fill="#991b1b">Wrong: stop the slice</text>
  <text x="172" y="830" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#991b1b">CSR.EN = 0</text>
  <line x1="172" y1="836" x2="172" y2="870" stroke="#991b1b" stroke-width="2" marker-end="url(#p05-arrow-red)"/>
  <line x1="44" y1="880" x2="332" y2="880" stroke="#166534" stroke-width="3"/>
  <path d="M44,916 L140,844 L140,916 L172,892 L332,892" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="172" cy="892" r="4" fill="#991b1b"/>
  <path d="M44,938 L92,938 L92,964 L140,964 L140,938 L332,938" fill="none" stroke="#111827" stroke-width="3"/>
  <g font-size="14">
    <text x="44" y="994">The counter freezes below CC, so the</text>
    <text x="44" y="1014">pin stays high. rustos never does this.</text>
  </g>

  <rect x="368" y="780" width="328" height="248" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="388" y="806" font-weight="bold" fill="#166534">Right: store CC = 0</text>
  <text x="432" y="830" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#166534">write(false)</text>
  <line x1="412" y1="836" x2="412" y2="870" stroke="#166534" stroke-width="2" marker-end="url(#p05-arrow-green)"/>
  <path d="M388,916 L484,844 L484,916 L580,844 L580,916 L676,844" fill="none" stroke="#374151" stroke-width="2"/>
  <path d="M388,880 L484,880 L484,916 L676,916" fill="none" stroke="#166534" stroke-width="3"/>
  <path d="M388,938 L436,938 L436,964 L676,964" fill="none" stroke="#111827" stroke-width="3"/>
  <g font-size="14">
    <text x="388" y="994">The counter keeps running. From the</text>
    <text x="388" y="1014">next wrap CTR &lt; 0 never holds: pin low.</text>
  </g>

  <g font-size="14">
    <text x="24" y="1058">Dropping an Rp2350PwmSquare also stores CC = 0, as write(false) does.</text>
    <text x="24" y="1078">Rp2350Pwm::silence_all (unsafe, for panic and fault handlers) clears CC on all 12</text>
    <text x="24" y="1098">slices, and writes nothing while the PWM block is still in reset (RESET_DONE bit 16).</text>
  </g>

  <!-- legend -->
  <text x="24" y="1138" font-size="14" font-weight="bold">Legend</text>
  <rect x="90" y="1126" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="114" y="1138" font-size="14">chip hardware</text>
  <rect x="236" y="1126" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="260" y="1138" font-size="14">rustos firmware</text>
  <rect x="392" y="1126" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="416" y="1138" font-size="14">safety rule</text>
</svg>
