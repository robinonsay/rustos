<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 942" width="720" height="942" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The rustos layers: applications drive pins through the api traits and call pico2 driver methods directly; pico2 implements the api traits and drives the RP2350 registers</title>
  <defs>
    <marker id="l01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="942" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">rustos in layers</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Each arrow points from code to the code it uses. api and pico2 depend on no external crate.</text>

  <!-- Applications band -->
  <rect x="16" y="76" width="688" height="180" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="32" y="100" font-size="14" font-weight="bold" fill="#4b5563">Applications: binary crates, each in its own Cargo workspace</text>

  <rect x="24" y="112" width="216" height="132" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="132" y="136" text-anchor="middle" font-weight="bold">Keyer firmware</text>
  <text x="132" y="157" text-anchor="middle" font-size="14">cw-message-gateway</text>
  <text x="132" y="178" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">firmware/pico2-keyer</text>
  <text x="132" y="199" text-anchor="middle" font-size="14" fill="#4b5563">main pins rustos 8c91507</text>
  <rect x="36" y="207" width="192" height="29" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="132" y="226" text-anchor="middle" font-size="14" fill="#4b5563">draft PR #31: 410dffa</text>

  <rect x="252" y="112" width="216" height="132" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="136" text-anchor="middle" font-weight="bold">Decoder firmware</text>
  <text x="360" y="157" text-anchor="middle" font-size="14">cw-message-gateway</text>
  <text x="360" y="178" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">firmware/pico2-decoder</text>
  <text x="360" y="199" text-anchor="middle" font-size="14" fill="#4b5563">open PR #30, not on main</text>
  <text x="360" y="220" text-anchor="middle" font-size="14" fill="#4b5563">pins rustos 80bf599</text>

  <rect x="480" y="112" width="216" height="132" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="588" y="136" text-anchor="middle" font-weight="bold">App from the template</text>
  <text x="588" y="157" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">templates/pico2</text>
  <text x="588" y="178" text-anchor="middle" font-size="14">made by cargo generate</text>
  <text x="588" y="199" text-anchor="middle" font-size="14" fill="#4b5563">follows rustos's default</text>
  <text x="588" y="220" text-anchor="middle" font-size="14" fill="#4b5563">branch (no pinned rev)</text>

  <!-- Arrow A: apps to api -->
  <line x1="200" y1="256" x2="200" y2="314" stroke="#374151" stroke-width="2" marker-end="url(#l01-arrow)"/>
  <text x="212" y="281" font-size="14">every app: pins and tones</text>
  <text x="212" y="300" font-size="14">through the api traits</text>

  <!-- Arrow B: apps to pico2 (right lane) -->
  <line x1="552" y1="256" x2="552" y2="510" stroke="#374151" stroke-width="2" marker-end="url(#l01-arrow)"/>
  <text x="564" y="334" font-size="14">every app calls</text>
  <text x="564" y="353" font-size="14">pico2 directly,</text>
  <text x="564" y="372" font-size="14">for example</text>
  <text x="564" y="398" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350::take()</text>
  <text x="564" y="418" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Gpio::new</text>
  <text x="564" y="438" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">timer.now()</text>
  <text x="564" y="458" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">watchdog.feed()</text>
  <text x="564" y="478" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">usb.poll()</text>

  <!-- api -->
  <rect x="24" y="316" width="500" height="138" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="342"><tspan font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api</tspan><tspan dx="8" font-size="14" fill="#4b5563">crate api/: portable, builds and tests on a computer</tspan></text>
  <text x="40" y="368" font-size="14" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">common</text>
  <text x="112" y="368" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ErrorType, Read&lt;T&gt;, Write&lt;T&gt;</text>
  <text x="40" y="390" font-size="14" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">gpio</text>
  <text x="112" y="390" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Gpio, GpioPinIn&lt;N&gt;, GpioPinOut&lt;N&gt;, Pull</text>
  <text x="40" y="412" font-size="14" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">device</text>
  <text x="112" y="412" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PinHandle&lt;N&gt;, DeviceHandle&lt;T&gt;, define_board!</text>
  <text x="40" y="434" font-size="14" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">usb</text>
  <text x="112" y="434" font-size="14">CDC-ACM device logic, unit-tested on the host</text>

  <!-- Arrow C: pico2 implements api -->
  <line x1="272" y1="514" x2="272" y2="456" stroke="#374151" stroke-width="2" marker-end="url(#l01-arrow)"/>
  <text x="284" y="478" font-size="14">implements the traits,</text>
  <text x="284" y="497" font-size="14">invokes define_board!</text>

  <!-- pico2 -->
  <rect x="24" y="514" width="672" height="218" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="540"><tspan font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">pico2</tspan><tspan dx="8" font-size="14" fill="#4b5563">crate firmware/pico2: runtime and drivers for the RP2350</tspan></text>
  <text x="40" y="566" font-size="14"><tspan font-weight="bold">Runtime</tspan><tspan dx="6">BOOT_INFO, vector table, OnReset, entry!, fault handlers, link.ld</tspan></text>
  <text x="40" y="590" font-size="14"><tspan font-weight="bold">Board</tspan><tspan dx="6">Rp2350 from define_board!: 30 pin handles, 9 device handles</tspan></text>
  <text x="40" y="614" font-size="14"><tspan font-weight="bold">Drivers</tspan><tspan dx="6" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">gpio clocks timer systick watchdog usb pwm dma adc</tspan></text>
  <rect x="40" y="632" width="520" height="84" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="56" y="656" font-size="14">multicore (start core 1), <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Usb::room()</tspan></text>
  <text x="56" y="678" font-size="14">also <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::multicore</tspan> and a 10th device handle, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1</tspan></text>
  <text x="56" y="700" font-size="14" fill="#4b5563">rustos PR #6, open, not on master</text>

  <!-- Arrow D: pico2 to hardware -->
  <line x1="360" y1="732" x2="360" y2="792" stroke="#374151" stroke-width="2" marker-end="url(#l01-arrow)"/>
  <text x="372" y="767" font-size="14">volatile reads and writes at fixed addresses</text>

  <!-- hardware -->
  <rect x="24" y="794" width="672" height="98" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="40" y="820" font-weight="bold">RP2350 on the Raspberry Pi Pico 2</text>
  <text x="40" y="844" font-size="14">2 Cortex-M33 cores, clk_sys 150 MHz, 520 KB RAM, 4 MB flash run in place</text>
  <text x="40" y="868" font-size="14">19 base addresses (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">RegAddr</tspan>), plus the core's own SysTick, VTOR, CPACR</text>

  <!-- legend -->
  <text x="24" y="922" font-size="14" font-weight="bold">Legend</text>
  <rect x="88" y="910" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="112" y="922" font-size="14">firmware</text>
  <rect x="200" y="910" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="224" y="922" font-size="14">hardware</text>
  <rect x="316" y="910" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="340" y="922" font-size="14">open PR, not merged</text>
</svg>
