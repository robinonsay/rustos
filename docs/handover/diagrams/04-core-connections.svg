<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1502" width="720" height="1502" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The core drivers and their users: Rp2350::take hands out every device handle; GPIO and DMA need no clock proof; Rp2350Clocks is the proof that SysTick, the timer, the watchdog, PWM, the ADC and USB take; the timer is handed to USB and to multicore on PR 6; the register map and reset helpers sit under every driver except SysTick; three firmware images in cw-message-gateway pin rustos by commit</title>
  <defs>
    <marker id="n04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1502" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">The core drivers: who takes what</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Constructor arguments at rustos master 80bf599. An arrow means "is passed to".</text>
  <text x="24" y="78" font-size="14" fill="#4b5563">Purple dashed boxes are on open PRs, not on master or main.</text>

  <!-- the board singleton -->
  <rect x="24" y="96" width="672" height="64" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="360" y="122" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350::take()</text>
  <text x="360" y="146" text-anchor="middle" font-size="14">once per boot: a DeviceHandle for each driver below, a PinHandle for each pin</text>

  <!-- no clock proof -->
  <rect x="24" y="188" width="318" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="212" font-weight="bold">GPIO</text>
  <text x="40" y="236" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Gpio::new(handle)</text>
  <text x="40" y="258" font-size="14" fill="#4b5563">no clock proof: key and PTT go low first</text>

  <rect x="378" y="188" width="318" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="394" y="212" font-weight="bold">DMA</text>
  <text x="394" y="236" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Dma::new(handle)</text>
  <text x="394" y="258" font-size="14" fill="#4b5563">no clock proof: needs clk_sys running</text>

  <!-- clocks: the proof -->
  <rect x="24" y="300" width="672" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="324" font-weight="bold">Clocks</text>
  <text x="40" y="348" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Clocks::new(handle)</text>
  <text x="40" y="370" font-size="14" fill="#4b5563">sets every clock, then returns the value whose reference is the proof</text>

  <!-- clocks bus down the left -->
  <path d="M44,384 V1012 H78" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/>
  <text x="56" y="410" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&amp;Rp2350Clocks</text>
  <line x1="44" y1="466" x2="78" y2="466" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/>
  <line x1="44" y1="570" x2="78" y2="570" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/>
  <line x1="44" y1="674" x2="78" y2="674" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/>
  <line x1="44" y1="778" x2="78" y2="778" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/>
  <line x1="44" y1="882" x2="78" y2="882" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/>

  <!-- the drivers that take the proof -->
  <rect x="80" y="424" width="560" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="448" font-weight="bold">SysTick</text>
  <text x="96" y="472" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350SysTick::new(handle, &amp;clocks)</text>
  <text x="96" y="494" font-size="14" fill="#4b5563">counts clk_sys cycles; needs no tick</text>

  <rect x="80" y="528" width="560" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="552" font-weight="bold">Watchdog</text>
  <text x="96" y="576" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Watchdog::new(handle, &amp;clocks)</text>
  <text x="96" y="598" font-size="14" fill="#4b5563">start() calls <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start_tick(Watchdog)</tspan> from timer.rs</text>

  <rect x="80" y="632" width="560" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="656" font-weight="bold">PWM</text>
  <text x="96" y="680" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Pwm::new(handle, &amp;clocks)</text>
  <text x="96" y="702" font-size="14" fill="#4b5563">every divider is worked out from CLK_SYS_HZ</text>

  <rect x="80" y="736" width="560" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="760" font-weight="bold">ADC</text>
  <text x="96" y="784" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Adc::new(handle, &amp;clocks)</text>
  <text x="96" y="806" font-size="14" fill="#4b5563">calls <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start_clk_adc()</tspan>; its divider uses CLK_ADC_HZ</text>

  <rect x="80" y="840" width="560" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="864" font-weight="bold">Timer</text>
  <text x="96" y="888" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Timer::new(handle, &amp;clocks)</text>
  <text x="96" y="910" font-size="14" fill="#4b5563">calls <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start_tick(Timer0)</tspan>; its reference is the time source</text>

  <!-- timer bus down the right -->
  <path d="M640,882 H672 V1116 H642" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/>
  <line x1="672" y1="1012" x2="642" y2="1012" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/>
  <text x="660" y="954" text-anchor="end" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&amp;Rp2350Timer</text>

  <rect x="80" y="970" width="560" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="96" y="994" font-weight="bold">USB</text>
  <text x="96" y="1018" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Usb::new(handle, &amp;clocks, &amp;timer, config)</text>
  <text x="96" y="1040" font-size="14" fill="#4b5563">takes both; the timer times the 10 ms disconnect pulse</text>

  <rect x="80" y="1074" width="560" height="84" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="96" y="1098" font-weight="bold">Core 1 launch (rustos PR 6, open)</text>
  <text x="96" y="1122" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Core1::launch(stack, entry, &amp;timer, timeout_us)</text>
  <text x="96" y="1144" font-size="14" fill="#4b5563">no clock proof; the timer bounds the wait for core 1</text>

  <!-- under every driver -->
  <rect x="24" y="1186" width="672" height="114" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="1210" font-weight="bold">Under the drivers above: common::reg and common::reset</text>
  <text x="40" y="1234" font-size="14">RegAddr base addresses; atomic aliases at +0x1000, +0x2000, +0x3000</text>
  <text x="40" y="1256" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">cycle_reset, clr_reset_reg, wait_for_reset_done, is_reset_done</text>
  <text x="40" y="1278" font-size="14" fill="#4b5563">SysTick uses neither; the core 1 launch uses only RegAddr (for SIO)</text>

  <!-- users in cw-message-gateway -->
  <text x="24" y="1338" font-size="14" font-weight="bold" fill="#4b5563">Users in cw-message-gateway, each pinning rustos by commit</text>

  <rect x="24" y="1352" width="212" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="130" y="1378" text-anchor="middle" font-weight="bold">Keyer box</text>
  <text x="130" y="1400" text-anchor="middle" font-size="14">on main</text>
  <text x="130" y="1422" text-anchor="middle" font-size="14">rustos <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">8c91507</tspan></text>

  <rect x="254" y="1352" width="212" height="84" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="360" y="1378" text-anchor="middle" font-weight="bold">Decoder box</text>
  <text x="360" y="1400" text-anchor="middle" font-size="14">gateway PR 30, open</text>
  <text x="360" y="1422" text-anchor="middle" font-size="14">rustos <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">80bf599</tspan></text>

  <rect x="484" y="1352" width="212" height="84" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="590" y="1378" text-anchor="middle" font-weight="bold">One-Pico image</text>
  <text x="590" y="1400" text-anchor="middle" font-size="14">gateway PR 31, draft</text>
  <text x="590" y="1422" text-anchor="middle" font-size="14">rustos <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">410dffa</tspan> (PR 6)</text>

  <!-- legend -->
  <text x="24" y="1468" font-size="14" font-weight="bold">Legend</text>
  <rect x="88" y="1456" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="112" y="1468" font-size="14">on master or main</text>
  <rect x="262" y="1456" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="6 4"/><text x="286" y="1468" font-size="14">on an open PR</text>
  <line x1="420" y1="1463" x2="460" y2="1463" stroke="#374151" stroke-width="2" marker-end="url(#n04-arrow)"/><text x="468" y="1468" font-size="14">is passed to</text>
</svg>
