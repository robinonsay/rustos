<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 910" width="720" height="910" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The clock tree as Rp2350Clocks::new sets it up: the 12 MHz crystal oscillator feeds clk_ref at 12 MHz and both PLLs; PLL_SYS gives clk_sys and clk_peri at 150 MHz, PLL_USB gives clk_usb at 48 MHz and, once the ADC driver starts it, clk_adc at 48 MHz; the right-hand column names the rustos drivers that rely on each clock</title>
  <defs>
    <marker id="c04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="910" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">The clock tree after Rp2350Clocks::new</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Values from firmware/pico2/src/clocks.rs at rustos master 80bf599. Before it runs,</text>
  <text x="24" y="78" font-size="14" fill="#4b5563">clk_ref and clk_sys both run from the ring oscillator (ROSC, about 11 MHz).</text>

  <!-- column headings -->
  <text x="130" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b5563">Source</text>
  <text x="331" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b5563">Clock generator</text>
  <text x="575" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b5563">Who relies on it</text>

  <!-- crystal -->
  <rect x="52" y="124" width="156" height="56" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="130" y="148" text-anchor="middle" font-weight="bold">12 MHz crystal</text>
  <text x="130" y="169" text-anchor="middle" font-size="14">on the Pico 2 board</text>
  <line x1="130" y1="180" x2="130" y2="206" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>

  <!-- ===== Row A: XOSC, clk_ref, the 1 us tick ===== -->
  <rect x="52" y="208" width="156" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="130" y="234" text-anchor="middle" font-weight="bold">XOSC</text>
  <text x="130" y="256" text-anchor="middle" font-size="14">12 MHz</text>
  <text x="130" y="278" text-anchor="middle" font-size="14">start-up wait 6 ms</text>

  <rect x="236" y="208" width="190" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="331" y="234" text-anchor="middle" font-weight="bold">clk_ref</text>
  <text x="331" y="256" text-anchor="middle" font-weight="bold">12 MHz</text>
  <text x="331" y="278" text-anchor="middle" font-size="14">SRC = XOSC, ÷ 1</text>

  <rect x="454" y="208" width="242" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="466" y="232" font-size="14" fill="#4b5563">1 µs tick (TICKS ÷ 12) drives:</text>
  <text x="466" y="255" font-size="14">TIMER0: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Timer</tspan></text>
  <text x="466" y="277" font-size="14">Watchdog: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Watchdog</tspan></text>

  <line x1="208" y1="250" x2="234" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>
  <line x1="426" y1="250" x2="452" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>

  <!-- XOSC to PLL_SYS (down) and to PLL_USB (round the left) -->
  <line x1="130" y1="292" x2="130" y2="328" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>
  <path d="M52,276 H32 V637 H50" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>

  <!-- ===== Row B: PLL_SYS, clk_sys, its users ===== -->
  <rect x="52" y="330" width="156" height="132" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="130" y="362" text-anchor="middle" font-weight="bold">PLL_SYS</text>
  <text x="130" y="386" text-anchor="middle" font-size="14">12 ÷ 1 × 125</text>
  <text x="130" y="408" text-anchor="middle" font-size="14">VCO 1500 MHz</text>
  <text x="130" y="430" text-anchor="middle" font-size="14">÷ 5 ÷ 2 = 150 MHz</text>

  <rect x="236" y="330" width="190" height="132" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="331" y="362" text-anchor="middle" font-weight="bold">clk_sys</text>
  <text x="331" y="384" text-anchor="middle" font-weight="bold">150 MHz</text>
  <text x="331" y="408" text-anchor="middle" font-size="14">SRC = aux,</text>
  <text x="331" y="430" text-anchor="middle" font-size="14">aux = PLL_SYS, ÷ 1</text>

  <rect x="454" y="330" width="242" height="132" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="466" y="354" font-size="14">SysTick: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350SysTick</tspan></text>
  <text x="466" y="376" font-size="14">PWM: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Pwm</tspan></text>
  <text x="466" y="398" font-size="14">DMA: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Dma</tspan></text>
  <text x="466" y="420" font-size="14" fill="#4b5563">(DMA uses no frequency)</text>
  <text x="466" y="442" font-size="14" fill="#4b5563">(also clocks cores, bus, SRAM)</text>

  <line x1="208" y1="396" x2="234" y2="396" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>
  <line x1="426" y1="396" x2="452" y2="396" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>

  <!-- clk_sys to clk_peri -->
  <line x1="331" y1="462" x2="331" y2="488" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>

  <!-- ===== Row B2: clk_peri ===== -->
  <rect x="236" y="490" width="190" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="331" y="516" text-anchor="middle" font-weight="bold">clk_peri 150 MHz</text>
  <text x="331" y="540" text-anchor="middle" font-size="14">aux = clk_sys, ÷ 1</text>
  <text x="454" y="527" font-size="14" fill="#4b5563">UART, SPI: no rustos driver</text>

  <!-- ===== Row C: PLL_USB, clk_usb, USB ===== -->
  <rect x="52" y="582" width="156" height="110" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="130" y="608" text-anchor="middle" font-weight="bold">PLL_USB</text>
  <text x="130" y="630" text-anchor="middle" font-size="14">12 ÷ 1 × 100</text>
  <text x="130" y="652" text-anchor="middle" font-size="14">VCO 1200 MHz</text>
  <text x="130" y="674" text-anchor="middle" font-size="14">÷ 5 ÷ 5 = 48 MHz</text>

  <rect x="236" y="582" width="190" height="110" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="331" y="608" text-anchor="middle" font-weight="bold">clk_usb</text>
  <text x="331" y="630" text-anchor="middle" font-weight="bold">48 MHz</text>
  <text x="331" y="652" text-anchor="middle" font-size="14">aux = PLL_USB, ÷ 1</text>
  <text x="331" y="674" text-anchor="middle" font-size="14">must be exactly 48 MHz</text>

  <rect x="454" y="582" width="242" height="110" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="466" y="608" font-size="14">USB: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Usb</tspan></text>
  <text x="466" y="630" font-size="14">also needs clk_sys at least</text>
  <text x="466" y="652" font-size="14">10% faster than clk_usb</text>
  <text x="466" y="674" font-size="14">(erratum RP2350-E12)</text>

  <line x1="208" y1="637" x2="234" y2="637" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>
  <line x1="426" y1="637" x2="452" y2="637" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>

  <!-- PLL_USB to clk_adc -->
  <path d="M130,692 V766 H234" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>

  <!-- ===== Row C2: clk_adc ===== -->
  <rect x="236" y="722" width="190" height="88" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="331" y="748" text-anchor="middle" font-weight="bold">clk_adc 48 MHz</text>
  <text x="331" y="770" text-anchor="middle" font-size="14">aux = PLL_USB, ÷ 1</text>
  <text x="331" y="792" text-anchor="middle" font-size="14">started by the ADC</text>

  <rect x="454" y="722" width="242" height="88" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="466" y="748" font-size="14">ADC: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Adc</tspan></text>
  <text x="466" y="770" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Adc::new</tspan> calls</text>
  <text x="466" y="792" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start_clk_adc()</text>

  <line x1="426" y1="766" x2="452" y2="766" stroke="#374151" stroke-width="2" marker-end="url(#c04-arrow)"/>

  <!-- legend -->
  <text x="24" y="846" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="858" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="48" y="870" font-size="14">hardware (board or chip)</text>
  <rect x="262" y="858" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="286" y="870" font-size="14">rustos driver that needs it</text>
  <text x="24" y="896" font-size="14" fill="#4b5563">The 150 MHz and 48 MHz values are checked by const asserts when the crate builds.</text>
</svg>
