<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1948" width="720" height="1948" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Power-on to main: the bootrom finds the IMAGE_DEF block, enters through the vector table, OnReset runs its four steps and calls the application's main; below it, the fault path runs the safe state first and then stops, unless a fault the core cannot take locks it up until a reset</title>
  <defs>
    <marker id="b02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1948" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">Power-on to main, and the fault path</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">rustos master 80bf599: firmware/pico2/src/lib.rs and link.ld</text>

  <!-- ============ Section 1: normal boot ============ -->
  <text x="24" y="96" font-weight="bold" fill="#374151">Boot, core 0</text>

  <!-- A: reset -->
  <rect x="24" y="112" width="448" height="116" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="248" y="148" text-anchor="middle" font-weight="bold">Power-on, RUN pin or watchdog reset</text>
  <text x="248" y="176" text-anchor="middle" font-size="14">Both cores start in the bootrom (ROM at 0x00000000).</text>
  <text x="248" y="200" text-anchor="middle" font-size="14">Core 0 carries on below; core 1 waits (right).</text>

  <!-- A': core 1 -->
  <rect x="528" y="112" width="168" height="116" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="612" y="138" text-anchor="middle" font-size="14">Core 1 waits in</text>
  <text x="612" y="158" text-anchor="middle" font-size="14">the bootrom</text>
  <rect x="540" y="168" width="144" height="50" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="612" y="188" text-anchor="middle" font-size="14">PR #6: core 0</text>
  <text x="612" y="207" text-anchor="middle" font-size="14">launches core 1</text>
  <line x1="472" y1="170" x2="528" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>

  <line x1="248" y1="228" x2="248" y2="256" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>

  <!-- B: scan -->
  <rect x="24" y="256" width="448" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="248" y="288" text-anchor="middle" font-weight="bold">Bootrom scans the first 4 kB of flash</text>
  <text x="248" y="314" text-anchor="middle" font-size="14">for a valid <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">IMAGE_DEF</tspan> metadata block</text>

  <!-- B': not found -->
  <rect x="528" y="256" width="168" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="612" y="282" text-anchor="middle" font-size="14" font-weight="bold">No valid block:</text>
  <text x="612" y="302" text-anchor="middle" font-size="14">USB mass-storage</text>
  <text x="612" y="322" text-anchor="middle" font-size="14">(BOOTSEL) mode</text>
  <line x1="472" y1="296" x2="528" y2="296" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>
  <text x="500" y="285" text-anchor="middle" font-size="14" fill="#4b5563">none</text>

  <line x1="248" y1="336" x2="248" y2="376" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>
  <text x="262" y="358" font-size="14" fill="#4b5563">found</text>

  <!-- C: BOOT_INFO -->
  <rect x="24" y="376" width="448" height="88" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="248" y="404" text-anchor="middle" font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">BOOT_INFO</tspan>: 5 words, 20 bytes</text>
  <text x="248" y="428" text-anchor="middle" font-size="14">at 0x10000110: executable, Secure, Arm, RP2350</text>
  <text x="248" y="450" text-anchor="middle" font-size="14">names no entry point</text>

  <line x1="248" y1="464" x2="248" y2="492" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>

  <!-- D: vector table entry -->
  <rect x="24" y="492" width="448" height="108" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="248" y="520" text-anchor="middle" font-weight="bold">Bootrom enters through <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">VECTOR_TABLE</tspan></text>
  <text x="248" y="542" text-anchor="middle" font-size="14">at 0x10000000, the first byte of flash</text>
  <text x="248" y="564" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">SP = word 0 = 0x20082000</text>
  <text x="248" y="586" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PC = word 1 = OnReset</text>

  <line x1="248" y1="600" x2="248" y2="628" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>

  <!-- E: OnReset -->
  <rect x="24" y="628" width="672" height="292" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="656" font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OnReset</tspan>: RAM not initialised yet</text>
  <text x="680" y="656" text-anchor="end" font-size="14" fill="#4b5563" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">lib.rs:436-445</text>

  <rect x="40" y="672" width="640" height="40" rx="6" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="56" y="697" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold">1 enable_fpu</text>
  <text x="236" y="697" font-size="14">FPU on: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CPACR |= 0x00F00000</tspan>, then dsb, isb</text>

  <rect x="40" y="720" width="640" height="40" rx="6" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="56" y="745" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold">2 reset_vtor</text>
  <text x="236" y="745" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">VTOR</tspan> = address of <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">VECTOR_TABLE</tspan>, then dsb, isb</text>

  <rect x="40" y="768" width="640" height="40" rx="6" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="56" y="793" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold">3 reset_data</text>
  <text x="236" y="793" font-size="14">copy .data from <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">__sidata</tspan> (flash) to <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">__sdata</tspan> (RAM)</text>

  <rect x="40" y="816" width="640" height="40" rx="6" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="56" y="841" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold">4 reset_bss</text>
  <text x="236" y="841" font-size="14">zero .bss from <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">__sbss</tspan> to <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">__ebss</tspan></text>

  <rect x="40" y="864" width="640" height="40" rx="6" fill="#ffffff" stroke="#166534" stroke-width="2"/>
  <text x="56" y="889" font-size="15" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold">5 __rustos_main</text>
  <text x="236" y="889" font-size="14">call the application; it never returns</text>

  <line x1="248" y1="920" x2="248" y2="948" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>

  <!-- F: __rustos_main -->
  <rect x="24" y="948" width="448" height="68" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="248" y="976" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">__rustos_main()</text>
  <text x="248" y="1000" text-anchor="middle" font-size="14">made by <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">entry!(main)</tspan>; checks main is <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">fn() -&gt; !</tspan></text>

  <line x1="248" y1="1016" x2="248" y2="1044" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>

  <!-- G: application main -->
  <rect x="24" y="1044" width="448" height="88" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="248" y="1072" text-anchor="middle" font-weight="bold">Application <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">main() -&gt; !</tspan></text>
  <text x="248" y="1096" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350::take()</tspan>, drivers, then loops forever</text>
  <text x="248" y="1118" text-anchor="middle" font-size="14">runs on the ring oscillator until clocks are set</text>

  <!-- ============ Section 2: fault path ============ -->
  <line x1="24" y1="1160" x2="696" y2="1160" stroke="#d1d5db" stroke-width="1"/>
  <text x="24" y="1188" font-weight="bold" fill="#374151">Fault path (on whichever core faulted)</text>

  <!-- H: exception -->
  <rect x="24" y="1204" width="444" height="68" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="246" y="1232" text-anchor="middle" font-weight="bold">Fault, NMI or an enabled interrupt</text>
  <text x="246" y="1256" text-anchor="middle" font-size="14">CPU loads the handler at VTOR + 4 × exception number</text>

  <!-- Q: panic source -->
  <rect x="480" y="1204" width="216" height="68" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="588" y="1232" text-anchor="middle" font-weight="bold">A panic</text>
  <text x="588" y="1256" text-anchor="middle" font-size="14">panic!, failed unwrap, ...</text>

  <line x1="132" y1="1272" x2="132" y2="1304" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>
  <line x1="360" y1="1272" x2="360" y2="1304" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>
  <line x1="588" y1="1272" x2="588" y2="1304" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>

  <!-- I: OnHardFault -->
  <rect x="24" y="1304" width="216" height="88" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="132" y="1332" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OnHardFault</text>
  <text x="132" y="1356" text-anchor="middle" font-size="14">slot 3, and every</text>
  <text x="132" y="1376" text-anchor="middle" font-size="14">fault escalated to it</text>

  <!-- J: DefaultHandler -->
  <rect x="252" y="1304" width="216" height="88" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="360" y="1332" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DefaultHandler</text>
  <text x="360" y="1356" text-anchor="middle" font-size="14">every other slot:</text>
  <text x="360" y="1376" text-anchor="middle" font-size="14">NMI, SVCall, IRQs, ...</text>

  <!-- P: panic handler -->
  <rect x="480" y="1304" width="216" height="88" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="588" y="1332" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">#[panic_handler]</text>
  <text x="588" y="1356" text-anchor="middle" font-size="14">the application's own;</text>
  <text x="588" y="1376" text-anchor="middle" font-size="14">rustos has none</text>

  <line x1="132" y1="1392" x2="132" y2="1456" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>
  <line x1="360" y1="1392" x2="360" y2="1456" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>
  <line x1="588" y1="1392" x2="588" y2="1456" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b02-arrow)"/>
  <text x="572" y="1414" text-anchor="end" font-size="14" fill="#4b5563">only if the app</text>
  <text x="572" y="1432" text-anchor="end" font-size="14" fill="#4b5563">calls its safe state</text>

  <!-- K: safe state (safety) -->
  <rect x="24" y="1456" width="672" height="96" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="360" y="1486" text-anchor="middle" font-weight="bold">First: the safe state, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">__rustos_safe_state()</tspan></text>
  <text x="360" y="1510" text-anchor="middle" font-size="14">runs the function named in <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">entry!(main, safe_state = f)</tspan></text>
  <text x="360" y="1534" text-anchor="middle" font-size="14">keyer box: one store opens the key and PTT lines before anything else</text>

  <!-- two ways out of the safe state -->
  <line x1="220" y1="1552" x2="220" y2="1592" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>
  <text x="234" y="1577" font-size="14" fill="#4b5563">it returns</text>
  <line x1="572" y1="1552" x2="572" y2="1592" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b02-arrow)"/>
  <text x="558" y="1577" text-anchor="end" font-size="14" fill="#4b5563">a fault the core cannot take</text>

  <!-- L: stop -->
  <rect x="24" y="1592" width="392" height="152" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="220" y="1620" text-anchor="middle" font-weight="bold">Then: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">loop {}</tspan>, stopped</text>
  <text x="220" y="1646" text-anchor="middle" font-size="14">fault handlers spin here;</text>
  <text x="220" y="1668" text-anchor="middle" font-size="14">a panic handler spins in its own loop</text>
  <rect x="40" y="1684" width="360" height="44" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="220" y="1711" text-anchor="middle" font-size="14">PR #6: the other core keeps running</text>

  <!-- N: lockup -->
  <rect x="448" y="1592" width="248" height="152" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="572" y="1620" text-anchor="middle" font-weight="bold">Or: lockup</text>
  <text x="572" y="1646" text-anchor="middle" font-size="14">the core stops; nothing more runs</text>
  <text x="572" y="1672" text-anchor="middle" font-size="14">a fault inside the safe state,</text>
  <text x="572" y="1692" text-anchor="middle" font-size="14">or a stack overflow under</text>
  <text x="572" y="1712" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">MSPLIM</tspan>, which may lock up</text>
  <text x="572" y="1732" text-anchor="middle" font-size="14">before the safe state runs</text>

  <line x1="220" y1="1744" x2="220" y2="1772" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>
  <line x1="572" y1="1744" x2="572" y2="1772" stroke="#374151" stroke-width="2" marker-end="url(#b02-arrow)"/>

  <!-- M: reset -->
  <rect x="24" y="1772" width="672" height="88" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="1800" text-anchor="middle" font-weight="bold">Until a reset</text>
  <text x="360" y="1824" text-anchor="middle" font-size="14">the watchdog once nothing feeds it, a debugger, or a power cycle;</text>
  <text x="360" y="1846" text-anchor="middle" font-size="14">then the boot starts again at the top</text>

  <!-- legend -->
  <rect x="24" y="1886" width="18" height="14" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="50" y="1898" font-size="14">rustos or application code</text>
  <rect x="252" y="1886" width="18" height="14" fill="#fef3c7" stroke="#92400e" stroke-width="2"/><text x="278" y="1898" font-size="14">chip hardware and bootrom</text>
  <rect x="488" y="1886" width="18" height="14" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/><text x="514" y="1898" font-size="14">safety rule</text>
  <rect x="24" y="1914" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="4 3"/><text x="50" y="1926" font-size="14">rustos PR #6, not on master yet</text>
</svg>
