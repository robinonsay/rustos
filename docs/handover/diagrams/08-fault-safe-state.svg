<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" width="720" height="960" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Sequence of a fault or panic in the keyer image: the handler calls safe_state, which opens key and PTT in one store, silences every PWM output, holds the tone pin low and, in the one-Pico image, sets the fault flag; core 0 then trips and stops feeding, and the 500 ms watchdog resets the chip</title>
  <defs>
    <marker id="c08f-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="960" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold">What a fault or panic does to the outputs</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">The keyer image. Time runs down. Step 4 and core 0's reaction are in the</text>
  <text x="24" y="78" font-size="14" fill="#4b5563">one-Pico image only (cw-message-gateway PR #31, draft).</text>

  <!-- lifeline heads -->
  <rect x="24" y="96" width="172" height="60" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" font-weight="bold">Faulting core</text>
  <text x="110" y="142" text-anchor="middle" font-size="14">handler or panic</text>
  <rect x="230" y="96" width="180" height="60" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="320" y="120" text-anchor="middle" font-weight="bold">Outputs</text>
  <text x="320" y="142" text-anchor="middle" font-size="14">key, PTT and tone pins</text>
  <rect x="440" y="96" width="136" height="60" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="508" y="120" text-anchor="middle" font-weight="bold">Core 0 loop</text>
  <text x="508" y="142" text-anchor="middle" font-size="14">one-Pico only</text>
  <rect x="598" y="96" width="98" height="60" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="647" y="120" text-anchor="middle" font-weight="bold">Watchdog</text>
  <text x="647" y="142" text-anchor="middle" font-size="14">500 ms</text>

  <!-- lifelines -->
  <line x1="110" y1="156" x2="110" y2="176" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="110" y1="228" x2="110" y2="498" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="110" y1="532" x2="110" y2="648" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="110" y1="708" x2="110" y2="716" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="320" y1="156" x2="320" y2="716" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="508" y1="156" x2="508" y2="498" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="508" y1="576" x2="508" y2="716" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="647" y1="156" x2="647" y2="716" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 0: the handler calls safe_state -->
  <rect x="36" y="176" width="148" height="52" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="110" y="198" text-anchor="middle" font-size="14">rustos handler calls</text>
  <text x="110" y="218" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">safe_state()</text>

  <!-- 1: key and PTT open -->
  <text x="120" y="256" font-size="14" font-weight="bold">1. key and PTT open</text>
  <text x="120" y="274" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">GPIO_OUT_CLR, 1 store</text>
  <line x1="110" y1="286" x2="318" y2="286" stroke="#374151" stroke-width="2" marker-end="url(#c08f-arrow)"/>

  <!-- 2: every PWM output off -->
  <text x="120" y="320" font-size="14" font-weight="bold">2. every tone off</text>
  <text x="120" y="338" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">silence_all(): CC = 0</text>
  <line x1="110" y1="350" x2="318" y2="350" stroke="#374151" stroke-width="2" marker-end="url(#c08f-arrow)"/>

  <!-- 3: tone pin low -->
  <text x="120" y="384" font-size="14" font-weight="bold">3. tone pin held low</text>
  <text x="120" y="402" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">tone_low(): GP18</text>
  <line x1="110" y1="414" x2="318" y2="414" stroke="#374151" stroke-width="2" marker-end="url(#c08f-arrow)"/>

  <!-- 4: fault flag (one-Pico) -->
  <text x="332" y="448" font-size="14" font-weight="bold">4. fault flag set</text>
  <text x="332" y="466" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">LINK.fault = true</text>
  <line x1="110" y1="478" x2="506" y2="478" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#c08f-arrow)"/>

  <!-- the faulting core spins -->
  <rect x="44" y="498" width="132" height="34" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="110" y="520" text-anchor="middle" font-size="14">then <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">loop {}</tspan></text>

  <!-- core 0 reacts (core 1 faulted) -->
  <rect x="440" y="498" width="136" height="78" rx="6" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="508" y="520" text-anchor="middle" font-size="14">if core 1 faulted:</text>
  <text x="508" y="540" text-anchor="middle" font-size="14">trip CORE1,</text>
  <text x="508" y="560" text-anchor="middle" font-size="14">stop feeding</text>

  <!-- 5: the watchdog resets the chip -->
  <text x="332" y="602" font-size="14" font-weight="bold">5. no feed for 500 ms</text>
  <text x="332" y="620" font-size="14">the chip resets</text>
  <line x1="647" y1="632" x2="112" y2="632" stroke="#374151" stroke-width="2" marker-end="url(#c08f-arrow)"/>

  <!-- after the reset -->
  <rect x="28" y="648" width="164" height="60" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="110" y="672" text-anchor="middle" font-size="14">boot: key, PTT low</text>
  <text x="110" y="692" text-anchor="middle" font-size="14">first; box tripped</text>

  <!-- never-loosen rule -->
  <rect x="24" y="736" width="672" height="52" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="36" y="758" font-size="14"><tspan font-weight="bold">Never loosen:</tspan> step 1 is the first store of every handler, key and PTT</text>
  <text x="36" y="778" font-size="14">together; the gateway's <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">check_faults.py</tspan> checks it in the built image.</text>

  <!-- limits of the picture -->
  <text x="24" y="814" font-size="14" fill="#4b5563">Before <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">watchdog.start</tspan> nothing resets the chip: the core stays in its loop</text>
  <text x="24" y="832" font-size="14" fill="#4b5563">with the outputs open until the board is unplugged.</text>
  <text x="24" y="858" font-size="14" fill="#4b5563">A stack overflow may lock a core up before step 1 (analysis, untested); then</text>
  <text x="24" y="876" font-size="14" fill="#4b5563">the watchdog, or core 0's 100 ms watch of core 1, is what opens the key.</text>

  <!-- legend -->
  <text x="24" y="926" font-size="14" font-weight="bold">Legend</text>
  <rect x="88" y="914" width="18" height="14" fill="#dcfce7" stroke="#166534"/>
  <text x="112" y="926" font-size="14">firmware</text>
  <rect x="190" y="914" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
  <text x="214" y="926" font-size="14">hardware</text>
  <rect x="296" y="914" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/>
  <text x="320" y="926" font-size="14">one-Pico only</text>
  <rect x="436" y="914" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/>
  <text x="460" y="926" font-size="14">safety rule</text>
</svg>
