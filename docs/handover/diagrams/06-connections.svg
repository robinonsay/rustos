<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 776" width="720" height="776" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The neighbours of pico2::multicore: the keyer image hands launch its stack, entry and timer; the board gives the core1 handle; api::multicore gives Launch, Step and Mailbox; the timer gives now and elapsed_since; the runtime gives the vector table, enable_fpu and the fault handlers; the SIO carries the words to core 1's bootrom, which jumps to core1_start; check_core1.py reads the built code; a watchdog reset puts core 1 back in the bootrom</title>
  <defs>
    <marker id="c06c-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="776" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">How pico2::multicore connects</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">rustos PR #6 at 410dffa (open, untested on hardware); an arrow is what one part hands the other</text>

  <g transform="translate(4,0)">
    <!-- ===== centre ===== -->
    <rect x="262" y="96" width="196" height="460" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="360" y="122" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">pico2::multicore</text>
    <text x="360" y="142" text-anchor="middle" font-size="14" fill="#4b5563">rustos PR #6</text>
    <text x="274" y="170" font-size="14" fill="#4b5563">public:</text>
    <g font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
      <text x="274" y="192">Rp2350Core1::launch</text>
      <text x="274" y="212">LaunchError</text>
      <text x="274" y="232">Core1Stack, range()</text>
      <text x="274" y="252">Fifo: Mailbox</text>
      <text x="274" y="272">Fifo::take_errors</text>
      <text x="274" y="292">core() -&gt; Core</text>
    </g>
    <text x="274" y="322" font-size="14" fill="#4b5563">private:</text>
    <g font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
      <text x="274" y="344">core1_start</text>
      <text x="274" y="364">core1_run</text>
      <text x="274" y="384">CORE1_ENTRY</text>
      <text x="274" y="404">CORE1_STACK_LIMIT</text>
    </g>
    <line x1="274" y1="424" x2="446" y2="424" stroke="#5b21b6" stroke-width="1"/>
    <text x="274" y="448" font-size="14">launch stores the entry</text>
    <text x="274" y="467" font-size="14">and the stack limit, runs</text>
    <text x="274" y="486" font-size="14">dsb, then steps Launch</text>
    <text x="274" y="505" font-size="14">until it is Launched or</text>
    <text x="274" y="524" font-size="14">the time limit runs out</text>

    <!-- ===== left column ===== -->
    <rect x="20" y="96" width="210" height="112" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="32" y="120" font-weight="bold">Keyer image</text>
    <text x="32" y="140" font-size="14">cw-message-gateway</text>
    <text x="32" y="158" font-size="14">PR #31 (draft), only user</text>
    <text x="32" y="178" font-size="14" fill="#4b5563">gives launch: STACK,</text>
    <text x="32" y="196" font-size="14" fill="#4b5563">core1::main, timer, 10 ms</text>
    <line x1="230" y1="152" x2="260" y2="152" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>

    <rect x="20" y="224" width="210" height="94" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="32" y="248" font-weight="bold">Board (board.rs)</text>
    <text x="32" y="268" font-size="14">core1 field: PR #6</text>
    <text x="32" y="288" font-size="14" fill="#4b5563">gives: one core1 handle</text>
    <text x="32" y="306" font-size="14" fill="#4b5563">per boot, so one launch</text>
    <line x1="230" y1="271" x2="260" y2="271" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>

    <rect x="20" y="334" width="210" height="94" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="32" y="358" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::multicore</text>
    <text x="32" y="378" font-size="14">PR #6, host-tested</text>
    <text x="32" y="398" font-size="14" fill="#4b5563">gives: Launch, Step,</text>
    <text x="32" y="416" font-size="14" fill="#4b5563">Mailbox, QUIET_US</text>
    <line x1="230" y1="381" x2="260" y2="381" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>

    <rect x="20" y="444" width="210" height="112" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="32" y="468" font-weight="bold">Watchdog driver</text>
    <text x="32" y="488" font-size="14">master</text>
    <text x="32" y="508" font-size="14" fill="#4b5563">PSM.WDSEL includes</text>
    <text x="32" y="526" font-size="14" fill="#4b5563">PROC1: a timeout resets</text>
    <text x="32" y="544" font-size="14" fill="#4b5563">both cores</text>

    <!-- ===== right column ===== -->
    <rect x="490" y="96" width="210" height="112" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="502" y="120" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">check_core1.py</text>
    <text x="502" y="140" font-size="14">keyer CI, PR #31 (draft)</text>
    <text x="502" y="160" font-size="14" fill="#4b5563">takes: the machine code</text>
    <text x="502" y="178" font-size="14" fill="#4b5563">from core1_start and</text>
    <text x="502" y="196" font-size="14" fill="#4b5563">core1_run; symbol names</text>
    <line x1="458" y1="152" x2="488" y2="152" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>

    <rect x="490" y="224" width="210" height="94" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="502" y="248" font-weight="bold">Timer (Rp2350Timer)</text>
    <text x="502" y="268" font-size="14">master</text>
    <text x="502" y="288" font-size="14" fill="#4b5563">gives: now() and</text>
    <text x="502" y="306" font-size="14" fill="#4b5563">elapsed_since(), in µs</text>
    <line x1="490" y1="271" x2="460" y2="271" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>

    <rect x="490" y="334" width="210" height="130" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
    <text x="502" y="358" font-weight="bold">Runtime (lib.rs)</text>
    <text x="502" y="378" font-size="14">master</text>
    <text x="502" y="398" font-size="14" fill="#4b5563">gives: VECTOR_TABLE</text>
    <text x="502" y="416" font-size="14" fill="#4b5563">(word 4), enable_fpu(),</text>
    <text x="502" y="434" font-size="14" fill="#4b5563">the fault handlers that</text>
    <text x="502" y="452" font-size="14" fill="#4b5563">run the safe state</text>
    <line x1="490" y1="399" x2="460" y2="399" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>

    <rect x="490" y="480" width="210" height="76" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
    <text x="502" y="504" font-weight="bold">SIO (chip)</text>
    <text x="502" y="524" font-size="14" fill="#4b5563">FIFO_ST, FIFO_WR,</text>
    <text x="502" y="542" font-size="14" fill="#4b5563">FIFO_RD, CPUID; SEV</text>
    <line x1="458" y1="506" x2="488" y2="506" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>
    <line x1="490" y1="532" x2="460" y2="532" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>

    <!-- ===== bottom: core 1's bootrom ===== -->
    <rect x="20" y="616" width="680" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
    <text x="360" y="642" text-anchor="middle" font-weight="bold">Core 1's bootrom ("Core 1 Wait")</text>
    <text x="360" y="664" text-anchor="middle" font-size="14">takes the six words through the SIO FIFOs and echoes each,</text>
    <text x="360" y="684" text-anchor="middle" font-size="14">then sets SP and VTOR and jumps to <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1_start</tspan>, on core 1</text>

    <line x1="125" y1="556" x2="125" y2="614" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>
    <text x="135" y="582" font-size="14" fill="#4b5563">a reset puts core 1</text>
    <text x="135" y="600" font-size="14" fill="#4b5563">back here</text>

    <line x1="300" y1="616" x2="300" y2="558" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>
    <text x="310" y="592" font-size="14" fill="#4b5563">jumps to <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1_start</tspan></text>

    <line x1="595" y1="558" x2="595" y2="614" stroke="#374151" stroke-width="2" marker-start="url(#c06c-arrow)" marker-end="url(#c06c-arrow)"/>
    <text x="605" y="582" font-size="14" fill="#4b5563">words,</text>
    <text x="605" y="600" font-size="14" fill="#4b5563">echoes</text>

    <!-- legend -->
    <rect x="20" y="716" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/>
    <text x="44" y="728" font-size="14">open PR (#6, #31)</text>
    <rect x="200" y="716" width="18" height="14" fill="#dcfce7" stroke="#166534"/>
    <text x="224" y="728" font-size="14">firmware on master</text>
    <rect x="400" y="716" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
    <text x="424" y="728" font-size="14">chip hardware and bootrom</text>
    <line x1="20" y1="754" x2="54" y2="754" stroke="#374151" stroke-width="2" marker-end="url(#c06c-arrow)"/>
    <text x="64" y="759" font-size="14">what one part hands the other (grey text in each box says what)</text>
  </g>
</svg>
