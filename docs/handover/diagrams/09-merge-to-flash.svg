<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1136" width="720" height="1136" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The chain from rustos PR #6 to a first run on a Pico 2: Robin's merge, the pin move in cw-message-gateway PR #31, the safety audit's new hash, the PR merges and Robin's go, then bring-up</title>
  <defs>
    <marker id="r09-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1136" fill="#ffffff"/>

  <text x="20" y="34" font-size="20" font-weight="bold">From a rustos merge to a flashed box</text>
  <text x="20" y="58" font-size="14" fill="#4b5563">Each step waits on the one above it; on 2026-10-13 only the first exists</text>

  <!-- legend -->
  <rect x="20" y="74" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="44" y="86" font-size="14">open PR or planned</text>
  <rect x="200" y="74" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="224" y="86" font-size="14">safety gate</text>
  <rect x="326" y="74" width="18" height="14" fill="#f3f4f6" stroke="#374151"/><text x="350" y="86" font-size="14">person</text>
  <rect x="424" y="74" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="448" y="86" font-size="14">hardware</text>

  <!-- section: in rustos -->
  <text x="20" y="124" font-size="14" font-weight="bold" fill="#4b5563">IN RUSTOS</text>

  <!-- rustos PR #6 -->
  <rect x="20" y="134" width="680" height="88" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="162" font-weight="bold">rustos PR #6: multicore and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Usb::room()</tspan></text>
  <text x="36" y="184" font-size="14">open, head <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">410dffa</tspan> on base <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">80bf599</tspan>, no CI, untested on hardware</text>
  <text x="36" y="206" font-size="14" fill="#4b5563">Who: Robin merges it; a merge commit keeps <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">410dffa</tspan> reachable</text>

  <line x1="360" y1="222" x2="360" y2="280" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="374" y="256" font-size="14">Robin merges</text>

  <!-- rustos master after the merge (planned) -->
  <rect x="20" y="282" width="680" height="88" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="310" font-weight="bold">rustos master after the merge (planned)</text>
  <text x="36" y="332" font-size="14">a new SHA; no box changes until a firmware pins it</text>
  <text x="36" y="354" font-size="14" fill="#4b5563">No CI runs here: rustos has no workflows (W3)</text>

  <line x1="360" y1="370" x2="360" y2="450" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="374" y="404" font-size="14">pin moved to the merge</text>

  <!-- section: outside rustos -->
  <text x="20" y="442" font-size="14" font-weight="bold" fill="#4b5563">OUTSIDE RUSTOS</text>

  <!-- cw-message-gateway PR #31 -->
  <rect x="20" y="452" width="680" height="110" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="36" y="480" font-weight="bold">cw-message-gateway PR #31 (draft): a new head</text>
  <text x="36" y="502" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">firmware/pico2-keyer/Cargo.toml</tspan>: rustos rev moves to the merge</text>
  <text x="36" y="524" font-size="14">the UF2 bytes change; the cleared hash <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">9ea00c58…51a7</tspan> goes stale</text>
  <text x="36" y="546" font-size="14" fill="#4b5563">Who: the keyer firmware's owner; CI's push run builds the file</text>

  <line x1="360" y1="562" x2="360" y2="620" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="374" y="596" font-size="14">new head and its CI artifact</text>

  <!-- safety audit -->
  <rect x="20" y="622" width="680" height="110" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="36" y="650" font-weight="bold">Safety audit: a fresh review and a new SHA-256</text>
  <text x="36" y="672" font-size="14">reviews the new head: its diff since <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bc5062a</tspan> and its checks</text>
  <text x="36" y="694" font-size="14">rebuilds the file from two paths; its hash must match CI's log</text>
  <text x="36" y="716" font-size="14" fill="#4b5563">Who: the safety audit. No posted hash, no flash</text>

  <line x1="360" y1="732" x2="360" y2="790" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="374" y="766" font-size="14">hash posted</text>

  <!-- Robin -->
  <rect x="20" y="792" width="680" height="110" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="36" y="820" font-weight="bold">Robin merges #30 and #31, then says go</text>
  <text x="36" y="842" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode</tspan> rebuilt from main; only the audited file is flashed</text>
  <text x="36" y="864" font-size="14">the box is unplugged from any radio while it is flashed</text>
  <text x="36" y="886" font-size="14" fill="#4b5563">Who: Robin. Nothing is flashed or keyed without her go</text>

  <line x1="360" y1="902" x2="360" y2="960" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="374" y="936" font-size="14">go</text>

  <!-- first run -->
  <rect x="20" y="962" width="680" height="154" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="36" y="990" font-weight="bold">First run on a Pico 2 (never done for this code)</text>
  <text x="36" y="1012" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode keyer check</tspan>, twice, before any keying</text>
  <text x="36" y="1034" font-size="14">bring-up step 11, where <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hangtest</tspan> runs (the audit's on-air ruling):</text>
  <text x="36" y="1056" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1test</tspan>, then <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1test --fault</tspan></text>
  <text x="36" y="1078" font-size="14" fill="#4b5563">The first time core 1 and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">room()</tspan> run on a chip; ADC and DMA too,</text>
  <text x="36" y="1100" font-size="14" fill="#4b5563">unless the PR #30 decoder box is flashed first</text>
</svg>
