<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1144" width="720" height="1144" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The chain from rustos PR #6 to a first run on a Pico 2: Robin's merge, the pin move in cw-message-gateway PR #31, the safety audit's new hash, the PR merges and Robin's go, then bring-up</title>
  <defs>
    <marker id="r09-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1144" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">From a rustos merge to a flashed box</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Each step waits on the one above it; on 2026-10-13 only the first exists</text>

  <!-- section: in rustos -->
  <text x="24" y="92" font-size="14" font-weight="bold" fill="#4b5563">IN RUSTOS</text>

  <!-- rustos PR #6 -->
  <rect x="24" y="102" width="680" height="88" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="130" font-weight="bold">rustos PR #6: multicore and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Usb::room()</tspan></text>
  <text x="40" y="152" font-size="14">open, head <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">410dffa</tspan> on base <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">80bf599</tspan>, no CI, untested on hardware</text>
  <text x="40" y="174" font-size="14" fill="#4b5563">Who: Robin merges it; a merge commit keeps <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">410dffa</tspan> reachable</text>

  <line x1="364" y1="190" x2="364" y2="248" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="378" y="224" font-size="14">Robin merges</text>

  <!-- rustos master after the merge (planned) -->
  <rect x="24" y="250" width="680" height="88" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="278" font-weight="bold">rustos master after the merge (planned)</text>
  <text x="40" y="300" font-size="14">a new SHA; no box changes until a firmware pins it</text>
  <text x="40" y="322" font-size="14" fill="#4b5563">No CI runs here: rustos has no workflows (W3)</text>

  <line x1="364" y1="338" x2="364" y2="418" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="378" y="372" font-size="14">pin moved to the merge</text>

  <!-- section: outside rustos -->
  <text x="24" y="410" font-size="14" font-weight="bold" fill="#4b5563">OUTSIDE RUSTOS</text>

  <!-- cw-message-gateway PR #31 -->
  <rect x="24" y="420" width="680" height="110" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="448" font-weight="bold">cw-message-gateway PR #31 (draft): a new head</text>
  <text x="40" y="470" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">firmware/pico2-keyer/Cargo.toml</tspan>: rustos rev moves to the merge</text>
  <text x="40" y="492" font-size="14">the UF2 bytes change; the cleared hash <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">9ea00c58…51a7</tspan> goes stale</text>
  <text x="40" y="514" font-size="14" fill="#4b5563">Who: the keyer firmware's owner; CI's push run builds the file</text>

  <line x1="364" y1="530" x2="364" y2="588" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="378" y="564" font-size="14">new head and its CI artifact</text>

  <!-- safety audit -->
  <rect x="24" y="590" width="680" height="110" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="618" font-weight="bold">Safety audit: a fresh review and a new SHA-256</text>
  <text x="40" y="640" font-size="14">reviews the new head: its diff since <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">bc5062a</tspan> and its checks</text>
  <text x="40" y="662" font-size="14">rebuilds the file from two paths; its hash must match CI's log</text>
  <text x="40" y="684" font-size="14" fill="#4b5563">Who: the safety audit. No posted hash, no flash</text>

  <line x1="364" y1="700" x2="364" y2="758" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="378" y="734" font-size="14">hash posted</text>

  <!-- Robin -->
  <rect x="24" y="760" width="680" height="110" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="40" y="788" font-weight="bold">Robin merges #30 and #31, then says go</text>
  <text x="40" y="810" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode</tspan> rebuilt from main; only the audited file is flashed</text>
  <text x="40" y="832" font-size="14">the box is unplugged from any radio while it is flashed</text>
  <text x="40" y="854" font-size="14" fill="#4b5563">Who: Robin. Nothing is flashed or keyed without her go</text>

  <line x1="364" y1="870" x2="364" y2="928" stroke="#374151" stroke-width="2" marker-end="url(#r09-arrow)"/>
  <text x="378" y="904" font-size="14">go</text>

  <!-- first run -->
  <rect x="24" y="930" width="680" height="154" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="40" y="958" font-weight="bold">First run on a Pico 2 (never done for this code)</text>
  <text x="40" y="980" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hfnode keyer check</tspan>, twice, before any keying</text>
  <text x="40" y="1002" font-size="14">bring-up step 11, where <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">hangtest</tspan> runs (the audit's on-air ruling):</text>
  <text x="40" y="1024" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1test</tspan>, then <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1test --fault</tspan></text>
  <text x="40" y="1046" font-size="14" fill="#4b5563">The first time core 1 and <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">room()</tspan> run on a chip; ADC and DMA too,</text>
  <text x="40" y="1068" font-size="14" fill="#4b5563">unless the PR #30 decoder box is flashed first</text>

  <!-- legend -->
  <text x="24" y="1120" font-size="14" font-weight="bold">Legend</text>
  <rect x="88" y="1108" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/><text x="112" y="1120" font-size="14">open PR or planned</text>
  <rect x="268" y="1108" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="292" y="1120" font-size="14">safety gate</text>
  <rect x="394" y="1108" width="18" height="14" fill="#f3f4f6" stroke="#374151"/><text x="418" y="1120" font-size="14">person</text>
  <rect x="492" y="1108" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="516" y="1120" font-size="14">hardware</text>
</svg>
