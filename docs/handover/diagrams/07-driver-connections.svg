<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 792" width="720" height="792" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>A new rustos driver in the middle of its eight neighbours: the board, the chip-support helpers, the clocks, the GPIO layouts and the DMA hand it what it needs; it implements the api traits, gives the fault and panic path an off function, and reaches cw-message-gateway's firmware only through a pinned rustos commit</title>
  <defs>
    <marker id="c07-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="792" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">How a driver connects</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Arrows point from what is handed over to what uses it</text>

  <!-- top-left: board -->
  <rect x="24" y="88" width="200" height="136" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="114" font-weight="bold">Board</text>
  <text x="40" y="138" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">define_board!</text>
  <text x="40" y="160" font-size="14">common/board.rs: one</text>
  <text x="40" y="180" font-size="14">DeviceHandle per device,</text>
  <text x="40" y="200" font-size="14">one PinHandle per pin</text>

  <!-- top-centre: api traits -->
  <rect x="260" y="88" width="200" height="136" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="276" y="114" font-weight="bold">api traits</text>
  <text x="276" y="138" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ErrorType</text>
  <text x="276" y="160" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Write&lt;T&gt;, Read&lt;T&gt;</text>
  <text x="276" y="182" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Gpio, Pull</text>
  <text x="276" y="204" font-size="14" fill="#4b5563">portable, host-tested</text>

  <!-- top-right: chip support -->
  <rect x="496" y="88" width="200" height="136" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="512" y="114" font-weight="bold">Chip support</text>
  <text x="512" y="138" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">RegAddr::NAME</text>
  <text x="512" y="160" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">cycle_reset(M)</text>
  <text x="512" y="182" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">clr_reset_reg(!M)</text>
  <text x="512" y="204" font-size="14" fill="#4b5563">common/reg.rs, reset.rs</text>

  <!-- middle-left: clocks -->
  <rect x="24" y="316" width="200" height="150" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="40" y="342" font-weight="bold">Clocks</text>
  <text x="40" y="366" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&amp;Rp2350Clocks</text>
  <text x="40" y="386" font-size="14">proof that the clock</text>
  <text x="40" y="406" font-size="14">tree is configured</text>
  <text x="40" y="430" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">CLK_*_HZ</text>
  <text x="40" y="450" font-size="14">for the arithmetic</text>

  <!-- centre: the driver -->
  <rect x="260" y="316" width="200" height="150" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="276" y="342" font-weight="bold">Your driver</text>
  <text x="276" y="366" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">firmware/pico2/</text>
  <text x="276" y="386" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">src/&lt;name&gt;.rs</text>
  <text x="276" y="410" font-size="14">new, factories, Drop,</text>
  <text x="276" y="430" font-size="14">and an off function</text>

  <!-- middle-right: pin routing -->
  <rect x="496" y="316" width="200" height="150" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="512" y="342" font-weight="bold">Pin routing</text>
  <text x="512" y="366" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">gpio::IoBank</text>
  <text x="512" y="386" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">gpio::PadsBank</text>
  <text x="512" y="410" font-size="14">pub(crate) layouts:</text>
  <text x="512" y="430" font-size="14">pad, FUNCSEL, then</text>
  <text x="512" y="450" font-size="14">ISO last</text>

  <!-- bottom-left: fault and panic path -->
  <rect x="24" y="558" width="200" height="150" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="40" y="584" font-weight="bold">Faults and panics</text>
  <text x="40" y="606" font-size="14">the app's safe state,</text>
  <text x="40" y="626" font-size="14">named in entry!, and its</text>
  <text x="40" y="646" font-size="14">panic handler call your</text>
  <text x="40" y="666" font-size="14">off function, such as</text>
  <text x="40" y="688" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">silence_all()</text>

  <!-- bottom-centre: gateway firmware -->
  <rect x="260" y="558" width="200" height="150" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="276" y="584" font-weight="bold">Gateway firmware</text>
  <text x="276" y="606" font-size="14">cw-message-gateway's</text>
  <text x="276" y="626" font-size="14">keyer pins one rustos</text>
  <text x="276" y="646" font-size="14">commit; moving it makes</text>
  <text x="276" y="666" font-size="14">a new image for the</text>
  <text x="276" y="686" font-size="14">safety audit</text>

  <!-- bottom-right: DMA -->
  <rect x="496" y="558" width="200" height="150" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="512" y="584" font-weight="bold">DMA</text>
  <text x="512" y="608" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350DmaChannel&lt;C&gt;</text>
  <text x="512" y="628" font-size="14">one token per channel</text>
  <text x="512" y="652" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">dma::dma(), CTRL_*</text>
  <text x="512" y="672" font-size="14">pub(crate) registers</text>

  <!-- arrows -->
  <line x1="200" y1="224" x2="284" y2="314" stroke="#374151" stroke-width="2" marker-end="url(#c07-arrow)"/>
  <line x1="360" y1="316" x2="360" y2="226" stroke="#374151" stroke-width="2" marker-end="url(#c07-arrow)"/>
  <text x="370" y="276" font-size="14">implements</text>
  <line x1="520" y1="224" x2="436" y2="314" stroke="#374151" stroke-width="2" marker-end="url(#c07-arrow)"/>
  <line x1="224" y1="391" x2="258" y2="391" stroke="#374151" stroke-width="2" marker-end="url(#c07-arrow)"/>
  <line x1="496" y1="391" x2="462" y2="391" stroke="#374151" stroke-width="2" marker-end="url(#c07-arrow)"/>
  <line x1="284" y1="466" x2="200" y2="556" stroke="#374151" stroke-width="2" marker-end="url(#c07-arrow)"/>
  <line x1="360" y1="466" x2="360" y2="556" stroke="#374151" stroke-width="2" marker-end="url(#c07-arrow)"/>
  <text x="370" y="516" font-size="14">rev pin</text>
  <line x1="520" y1="558" x2="436" y2="468" stroke="#374151" stroke-width="2" marker-end="url(#c07-arrow)"/>

  <!-- legend -->
  <text x="24" y="744" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="756" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="48" y="768" font-size="14">firmware (pico2)</text>
  <rect x="180" y="756" width="18" height="14" fill="#dbeafe" stroke="#1e40af"/><text x="204" y="768" font-size="14">api, host-tested</text>
  <rect x="336" y="756" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="360" y="768" font-size="14">safety: off path</text>
  <rect x="496" y="756" width="18" height="14" fill="#f3f4f6" stroke="#374151"/><text x="520" y="768" font-size="14">outside rustos</text>
</svg>
