<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1600" width="720" height="1600" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>One RP2350 GPIO: IO_BANK0's FUNCSEL connects SIO, PWM, a USB helper or nothing to the pin; the PADS_BANK0 register sets output disable, input enable, drive and pulls; the ISO latch holds the pad until software clears it last; GPIO26-29 also feed the ADC as an analog input; the keyer box's key pin GP16 drives an inverting key switch and needs an external 4.7 kOhm pull-down because of erratum RP2350-E9; and what each kind of reset leaves on the pin</title>
  <defs>
    <marker id="g05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1600" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">One RP2350 GPIO: signal, pad and isolation latch</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">IO_BANK0 picks the signal, PADS_BANK0 sets the pad, ISO holds it (rustos 80bf599)</text>

  <!-- 1. sources -->
  <text x="24" y="94" font-size="14" font-weight="bold" fill="#374151">1. Four of the signal sources: GPIOn_CTRL.FUNCSEL picks one</text>

  <rect x="24" y="106" width="156" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="102" y="131" text-anchor="middle" font-weight="bold">F5: SIO</text>
  <text x="102" y="153" text-anchor="middle" font-size="14">level, enable</text>
  <text x="102" y="175" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Gpio</text>

  <rect x="196" y="106" width="156" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="274" y="131" text-anchor="middle" font-weight="bold">F4: PWM</text>
  <text x="274" y="153" text-anchor="middle" font-size="14">slice output</text>
  <text x="274" y="175" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Pwm</text>

  <rect x="368" y="106" width="156" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="446" y="131" text-anchor="middle" font-weight="bold">F10: USB</text>
  <text x="446" y="153" text-anchor="middle" font-size="14">VBUS, OVCUR</text>
  <text x="446" y="175" text-anchor="middle" font-size="14" fill="#4b5563">not used</text>

  <rect x="540" y="106" width="156" height="84" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="618" y="131" text-anchor="middle" font-weight="bold">0x1f: NULL</text>
  <text x="618" y="153" text-anchor="middle" font-size="14">output off</text>
  <text x="618" y="175" text-anchor="middle" font-size="14">reset; ADC pins</text>

  <line x1="102" y1="190" x2="102" y2="232" stroke="#374151" stroke-width="2" marker-end="url(#g05-arrow)"/>
  <line x1="274" y1="190" x2="274" y2="232" stroke="#374151" stroke-width="2" marker-end="url(#g05-arrow)"/>
  <line x1="446" y1="190" x2="446" y2="232" stroke="#374151" stroke-width="2" marker-end="url(#g05-arrow)"/>
  <line x1="618" y1="190" x2="618" y2="232" stroke="#374151" stroke-width="2" marker-end="url(#g05-arrow)"/>

  <rect x="24" y="234" width="672" height="124" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="260" text-anchor="middle" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">IO_BANK0 GPIOn_CTRL</text>
  <text x="360" y="283" text-anchor="middle" font-size="14">FUNCSEL (bits 4:0) connects one source to the pad; reset value 0x1f.</text>
  <text x="360" y="303" text-anchor="middle" font-size="14">OUTOVER, OEOVER = 0: level and enable come from that source.</text>
  <text x="360" y="325" text-anchor="middle" font-size="14" fill="#4b5563">Slots rustos never selects: F0 HSTX, F1 SPI, F2 UART, F3 I2C,</text>
  <text x="360" y="345" text-anchor="middle" font-size="14" fill="#4b5563">F6-F8 PIO0-2, F9 QMI, trace or clock, F11 UART (Table 644).</text>

  <line x1="360" y1="358" x2="360" y2="396" stroke="#374151" stroke-width="2" marker-end="url(#g05-arrow)"/>
  <text x="374" y="382" font-size="14" fill="#4b5563">output level, output enable</text>

  <!-- 2. pad register -->
  <rect x="24" y="398" width="672" height="254" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="44" y="424" font-weight="bold">2. The pad: PADS_BANK0 GPIOn, reset value 0x116</text>
  <text x="44" y="450" font-size="14" font-weight="bold" fill="#4b5563">bit</text>
  <text x="100" y="450" font-size="14" font-weight="bold" fill="#4b5563">field</text>
  <text x="220" y="450" font-size="14" font-weight="bold" fill="#4b5563">what it does</text>
  <text x="620" y="450" font-size="14" font-weight="bold" fill="#4b5563">reset</text>
  <line x1="40" y1="458" x2="680" y2="458" stroke="#92400e" stroke-width="1"/>
  <g font-size="14">
    <text x="44" y="478" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">8</text>
    <text x="100" y="478" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold">ISO</text>
    <text x="220" y="478">isolation latch: see 3 below</text>
    <text x="640" y="478" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="bold">1</text>

    <text x="44" y="500" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">7</text>
    <text x="100" y="500" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">OD</text>
    <text x="220" y="500">output disable; wins over any peripheral</text>
    <text x="640" y="500" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</text>

    <text x="44" y="522" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">6</text>
    <text x="100" y="522" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">IE</text>
    <text x="220" y="522">input buffer on; feeds SIO GPIO_IN</text>
    <text x="640" y="522" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</text>

    <text x="44" y="544" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">5:4</text>
    <text x="100" y="544" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DRIVE</text>
    <text x="220" y="544">drive strength: 0 to 3 = 2, 4, 8, 12 mA</text>
    <text x="640" y="544" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1</text>

    <text x="44" y="566" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">3</text>
    <text x="100" y="566" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PUE</text>
    <text x="220" y="566">internal pull-up</text>
    <text x="640" y="566" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</text>

    <text x="44" y="588" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">2</text>
    <text x="100" y="588" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PDE</text>
    <text x="220" y="588">internal pull-down</text>
    <text x="640" y="588" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1</text>

    <text x="44" y="610" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1</text>
    <text x="100" y="610" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">SCHMITT</text>
    <text x="220" y="610">hysteresis on the input</text>
    <text x="640" y="610" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1</text>

    <text x="44" y="632" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</text>
    <text x="100" y="632" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">SLEWFAST</text>
    <text x="220" y="632">1 = fast edges</text>
    <text x="640" y="632" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</text>
  </g>

  <line x1="360" y1="652" x2="360" y2="690" stroke="#374151" stroke-width="2" marker-end="url(#g05-arrow)"/>

  <!-- 3. ISO latch -->
  <rect x="24" y="692" width="672" height="128" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
  <text x="44" y="718" font-weight="bold">3. The isolation latch (ISO, pad bit 8)</text>
  <text x="44" y="742" font-size="14">ISO = 1: the pad holds the output enable, level, pulls and IE it had when</text>
  <text x="44" y="763" font-size="14">isolated (after power-on, the reset values). ISO = 0: transparent.</text>
  <text x="44" y="784" font-size="14">rustos drivers clear ISO last, after the pad and FUNCSEL.</text>
  <text x="44" y="805" font-size="14">A reset of the pad registers through RESETS does not set ISO again.</text>

  <line x1="360" y1="820" x2="360" y2="858" stroke="#374151" stroke-width="2" marker-end="url(#g05-arrow)"/>

  <!-- pin row -->
  <rect x="280" y="860" width="160" height="56" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="883" text-anchor="middle" font-weight="bold">GPIO pin</text>
  <text x="360" y="904" text-anchor="middle" font-size="14">e.g. GP16 (pin 21)</text>

  <!-- ADC (left): a different pin, GPIO26-29 only -->
  <rect x="24" y="836" width="160" height="124" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="104" y="861" text-anchor="middle" font-weight="bold">ADC input</text>
  <text x="104" y="883" text-anchor="middle" font-size="14">GPIO26-29 only</text>
  <text x="104" y="905" text-anchor="middle" font-size="14">FUNCSEL 0x1f,</text>
  <text x="104" y="927" text-anchor="middle" font-size="14">IE 0, OD 1,</text>
  <text x="104" y="949" text-anchor="middle" font-size="14">pulls off</text>
  <line x1="280" y1="888" x2="188" y2="888" stroke="#374151" stroke-width="2" marker-end="url(#g05-arrow)"/>
  <text x="232" y="878" text-anchor="middle" font-size="14" fill="#4b5563">analog</text>
  <text x="232" y="906" text-anchor="middle" font-size="14" fill="#4b5563">GPIO26-29</text>

  <!-- key switch (right, external hardware) -->
  <rect x="504" y="836" width="192" height="124" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="600" y="869" text-anchor="middle" font-weight="bold">Key switch</text>
  <text x="600" y="893" text-anchor="middle" font-size="14">PC817 via 470 Ω,</text>
  <text x="600" y="915" text-anchor="middle" font-size="14">2N3904 via 4.7-10 kΩ,</text>
  <text x="600" y="937" text-anchor="middle" font-size="14">or 2N7000 gate</text>

  <!-- wiring: pin to junction, junction to key switch and pull-down -->
  <line x1="360" y1="916" x2="360" y2="976" stroke="#374151" stroke-width="2"/>
  <circle cx="360" cy="976" r="4" fill="#374151"/>
  <line x1="360" y1="976" x2="600" y2="976" stroke="#374151" stroke-width="2"/>
  <line x1="600" y1="976" x2="600" y2="960" stroke="#374151" stroke-width="2"/>
  <line x1="360" y1="976" x2="360" y2="1006" stroke="#374151" stroke-width="2"/>

  <rect x="300" y="1006" width="120" height="62" rx="6" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="360" y="1033" text-anchor="middle" font-weight="bold">4.7 kΩ</text>
  <text x="360" y="1055" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">REQUIRED</text>
  <line x1="360" y1="1068" x2="360" y2="1090" stroke="#374151" stroke-width="2"/>
  <line x1="336" y1="1090" x2="384" y2="1090" stroke="#374151" stroke-width="2"/>
  <line x1="344" y1="1097" x2="376" y2="1097" stroke="#374151" stroke-width="2"/>
  <line x1="352" y1="1104" x2="368" y2="1104" stroke="#374151" stroke-width="2"/>
  <text x="394" y="1102" font-size="14">GND (pin 23)</text>
  <text x="436" y="1028" font-size="14" fill="#991b1b">external pull-down on GP16 (key)</text>
  <text x="436" y="1048" font-size="14" fill="#991b1b">and GP17 (PTT); never remove it</text>

  <!-- E9 -->
  <rect x="24" y="1126" width="672" height="112" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="44" y="1152" font-weight="bold">Erratum RP2350-E9: why the internal pull-down is not enough</text>
  <text x="44" y="1176" font-size="14">With IE = 1, the output off and the pin between the logic levels, the pad</text>
  <text x="44" y="1197" font-size="14">sources about 120 µA and sits near 2.2 V; the internal pull-down cannot pull</text>
  <text x="44" y="1218" font-size="14">it low. 8.2 kΩ or less to ground can: the keyer box uses 4.7 kΩ.</text>

  <!-- 4. after a reset -->
  <text x="24" y="1272" font-size="14" font-weight="bold" fill="#374151">4. What is on the pin after a reset</text>
  <line x1="24" y1="1282" x2="696" y2="1282" stroke="#374151" stroke-width="1"/>
  <g font-size="14">
    <text x="24" y="1304" font-weight="bold">Power-on, brown-out,</text>
    <text x="24" y="1324" font-weight="bold">RUN low, SW-DP</text>
    <text x="24" y="1344" font-weight="bold">CDBGRSTREQ, rescue</text>
    <text x="236" y="1304">The latches reset too: output off, input off,</text>
    <text x="236" y="1324">pulled down, ISO = 1. The pin comes up undriven</text>
    <text x="236" y="1344">until software configures it.</text>
    <line x1="24" y1="1360" x2="696" y2="1360" stroke="#9ca3af" stroke-width="1"/>

    <text x="24" y="1382" font-weight="bold">Watchdog reset</text>
    <text x="24" y="1402" font-weight="bold">(rustos's scope)</text>
    <text x="236" y="1382">IO_BANK0 and PADS_BANK0 are reset. A pad with</text>
    <text x="236" y="1402">ISO = 0 goes to output off, pulled down; an isolated</text>
    <text x="236" y="1422">pad keeps its latched state. Not checked on hardware.</text>
    <line x1="24" y1="1438" x2="696" y2="1438" stroke="#9ca3af" stroke-width="1"/>

    <text x="24" y="1460" font-weight="bold">Debugger warm reset</text>
    <text x="24" y="1480" font-weight="bold">(processors only)</text>
    <text x="236" y="1460">IO_BANK0 and PADS_BANK0 keep their values: a PWM</text>
    <text x="236" y="1480">pin keeps its tone until Rp2350Pwm::new disconnects it.</text>
    <line x1="24" y1="1496" x2="696" y2="1496" stroke="#374151" stroke-width="1"/>
  </g>
  <text x="24" y="1522" font-size="14" font-weight="bold" fill="#991b1b">So: drive every output that can key a radio to its safe level first, every boot.</text>

  <!-- legend -->
  <text x="24" y="1568" font-size="14" font-weight="bold">Legend</text>
  <rect x="90" y="1556" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="114" y="1568" font-size="14">hardware (chip and external)</text>
  <rect x="330" y="1556" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="354" y="1568" font-size="14">safety rule</text>
</svg>
