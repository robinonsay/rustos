<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1404" width="720" height="1404" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>The watchdog's life cycle: new reads the reset evidence, start arms a timeout, every loop pass saves state and feeds; if the loop stops the counter reaches zero and a system-level reset restarts both cores while REASON and the scratch registers survive; on the next boot new classifies the reason and the application reads its scratch registers back</title>
  <defs>
    <marker id="w04-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1404" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">The watchdog: start, feed, time-out, next boot</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Rp2350Watchdog in firmware/pico2/src/watchdog.rs at rustos master 80bf599</text>

  <!-- ===== Boot N ===== -->
  <text x="24" y="96" font-weight="bold" fill="#374151">Boot N</text>

  <!-- A: new -->
  <rect x="24" y="108" width="672" height="68" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="360" y="134" text-anchor="middle" font-size="14" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Watchdog::new(handle, &amp;clocks)</text>
  <text x="360" y="160" text-anchor="middle" font-size="14">reads REASON, CHIP_RESET and SCRATCH4; clears the marker</text>
  <line x1="249" y1="176" x2="249" y2="198" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>

  <!-- B: start -->
  <rect x="24" y="200" width="450" height="172" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="249" y="226" text-anchor="middle" font-size="14" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">start(timeout_us)</text>
  <text x="38" y="250" font-size="14">1. CTRL = 0: stop, and clear the three pause bits</text>
  <text x="38" y="272" font-size="14">2. PSM.WDSEL = every stage but ROSC and XOSC;</text>
  <text x="57" y="294" font-size="14">POWMAN.WDSEL = 0; SYSCFG.AUXCTRL bit 0 = 1</text>
  <text x="38" y="316" font-size="14">3. TICKS watchdog generator: 12 cycles = 1 µs</text>
  <text x="38" y="338" font-size="14">4. SCRATCH4 = marker 0x7275_7374 ("rust")</text>
  <text x="38" y="360" font-size="14">5. LOAD = timeout; 6. CTRL = ENABLE</text>

  <!-- side: keyer limit, passed to start -->
  <rect x="510" y="200" width="186" height="100" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="603" y="226" text-anchor="middle" font-size="14" font-weight="bold">Keyer box timeout</text>
  <text x="603" y="248" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">WATCHDOG_MS = 500</text>
  <text x="603" y="270" text-anchor="middle" font-size="14">start(500 000 µs)</text>
  <text x="603" y="290" text-anchor="middle" font-size="14" font-weight="bold">never loosen</text>
  <line x1="510" y1="250" x2="476" y2="250" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>

  <line x1="249" y1="372" x2="249" y2="394" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>

  <!-- C: loop -->
  <rect x="24" y="396" width="450" height="84" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="249" y="422" text-anchor="middle" font-size="14" font-weight="bold">Each pass of the main loop</text>
  <text x="249" y="446" text-anchor="middle" font-size="14">work, then <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">set_scratch(Scratch0 / Scratch1, ..)</tspan></text>
  <text x="249" y="468" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">feed()</tspan>: LOAD = timeout again</text>
  <path d="M474,464 H512 V418 H476" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>
  <text x="522" y="436" font-size="14" fill="#4b5563">every pass, sooner</text>
  <text x="522" y="456" font-size="14" fill="#4b5563">than the timeout</text>

  <!-- C to D -->
  <line x1="249" y1="480" x2="249" y2="558" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>
  <text x="262" y="502" font-size="14" fill="#4b5563">the loop stops feeding: a hang, a fault</text>
  <text x="262" y="520" font-size="14" fill="#4b5563">handler's spin, a CLOCK trip (tick stopped),</text>
  <text x="262" y="538" font-size="14" fill="#4b5563">or TEST HANG (the hang test)</text>

  <!-- D: timeout -->
  <rect x="24" y="560" width="450" height="64" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="249" y="586" text-anchor="middle" font-weight="bold">CTRL.TIME counts down to 0</text>
  <text x="249" y="610" text-anchor="middle" font-size="14">REASON.TIMER is set</text>

  <!-- E: force_reset -->
  <rect x="510" y="540" width="186" height="104" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="603" y="566" text-anchor="middle" font-size="14" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">force_reset()</text>
  <text x="603" y="588" text-anchor="middle" font-size="14">same scope, short wait,</text>
  <text x="603" y="610" text-anchor="middle" font-size="14">then CTRL.TRIGGER:</text>
  <text x="603" y="632" text-anchor="middle" font-size="14">REASON.FORCE is set</text>

  <line x1="249" y1="624" x2="249" y2="670" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>
  <line x1="603" y1="644" x2="603" y2="670" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>

  <!-- F: the reset -->
  <rect x="24" y="672" width="672" height="132" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="360" y="698" text-anchor="middle" font-weight="bold">Watchdog reset at system level (the power-on state machine)</text>
  <text x="38" y="722" font-size="14">Every stage but the two oscillators re-runs: both cores restart through the bootrom,</text>
  <text x="38" y="744" font-size="14">every peripheral is held in reset again, and clk_ref and clk_sys restart on the ROSC.</text>
  <text x="38" y="766" font-size="14">The program boots again; OnReset re-initialises its statics in RAM.</text>
  <text x="38" y="788" font-size="14">Pads whose ISO bit is 0 return to reset: output off, input off, pull-down (unverified).</text>

  <line x1="188" y1="804" x2="188" y2="830" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>

  <!-- G: kept -->
  <rect x="24" y="832" width="328" height="132" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="188" y="858" text-anchor="middle" font-weight="bold">Kept through this reset</text>
  <text x="38" y="882" font-size="14">WATCHDOG.REASON: TIMER or FORCE</text>
  <text x="38" y="904" font-size="14">SCRATCH0, SCRATCH1: the app's notes</text>
  <text x="38" y="926" font-size="14">SCRATCH4: the marker (unverified)</text>
  <text x="38" y="948" font-size="14">POWMAN.CHIP_RESET: the older cause</text>

  <!-- H: chip-level contrast -->
  <rect x="368" y="832" width="328" height="132" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <text x="532" y="858" text-anchor="middle" font-weight="bold">Instead: a chip-level reset</text>
  <text x="382" y="882" font-size="14">Unplugging, the RUN pin or a debugger</text>
  <text x="382" y="904" font-size="14">reset clears REASON and SCRATCH0-7.</text>
  <text x="382" y="926" font-size="14">CHIP_RESET names the cause; the</text>
  <text x="382" y="948" font-size="14">scratch registers read 0.</text>

  <!-- ===== Boot N+1 ===== -->
  <text x="24" y="1002" font-weight="bold" fill="#374151">Boot N+1</text>
  <line x1="188" y1="964" x2="188" y2="1012" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>
  <path d="M532,964 V1084 H476" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>
  <text x="544" y="1010" font-size="14" fill="#4b5563">next boot</text>

  <!-- I: classify -->
  <rect x="24" y="1014" width="450" height="148" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="249" y="1040" text-anchor="middle" font-size="14" font-weight="bold"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">new()</tspan> classifies; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">reset_reason()</tspan> returns:</text>
  <text x="38" y="1064" font-size="14">FORCE → <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">WatchdogForced(Trigger)</tspan></text>
  <text x="38" y="1086" font-size="14">TIMER and marker → <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">WatchdogTimeout</tspan></text>
  <text x="38" y="1108" font-size="14">TIMER, no marker → <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">WatchdogForced(Reboot)</tspan></text>
  <text x="38" y="1130" font-size="14">neither → <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ChipReset(cause)</tspan> from CHIP_RESET</text>
  <text x="38" y="1152" font-size="14" fill="#4b5563">(<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">new()</tspan> also set SCRATCH4 = 0 if it held the marker)</text>

  <line x1="249" y1="1162" x2="249" y2="1188" stroke="#374151" stroke-width="2" marker-end="url(#w04-arrow)"/>

  <!-- J: app reads scratch -->
  <rect x="24" y="1190" width="450" height="132" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="249" y="1216" text-anchor="middle" font-size="14" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">scratch(Scratch0), scratch(Scratch1)</text>
  <text x="38" y="1240" font-size="14">Keyer box: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Saved::decode</tspan>, then <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Keyer::restore</tspan></text>
  <text x="38" y="1262" font-size="14">keeps its trip; its duty budget starts at 0 or below</text>
  <text x="38" y="1284" font-size="14">and is earned back (a restart never refills it);</text>
  <text x="38" y="1306" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">WatchdogTimeout</tspan> means it comes up tripped.</text>

  <!-- legend -->
  <text x="24" y="1352" font-size="14" font-weight="bold">Legend</text>
  <rect x="24" y="1364" width="18" height="14" fill="#dcfce7" stroke="#166534"/><text x="48" y="1376" font-size="14">firmware</text>
  <rect x="140" y="1364" width="18" height="14" fill="#fef3c7" stroke="#92400e"/><text x="164" y="1376" font-size="14">chip hardware</text>
  <rect x="290" y="1364" width="18" height="14" fill="#fee2e2" stroke="#991b1b"/><text x="314" y="1376" font-size="14">safety limit</text>
</svg>
