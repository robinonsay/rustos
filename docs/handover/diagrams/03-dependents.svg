<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1170" width="720" height="1170" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>What implements and uses each api module: in pico2, the GPIO, PWM and USB types implement the common and gpio traits, the board invokes define_board!, three constructors consume pin handles, every driver takes a device handle, Rp2350Usb owns the USB logic and, on PR #6, Fifo and Rp2350Core1 use api::multicore; outside rustos, the keyer box, decoder box, one-Pico image and template applications name api items directly, each pinned to a rustos revision</title>
  <defs>
    <marker id="a03dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1170" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold">What implements and uses each api module</text>
  <text x="20" y="58" font-size="14" fill="#4b5563">Each arrow points from the user to the api module it uses. rustos master 80bf599.</text>
  <text x="20" y="78" font-size="14" fill="#4b5563">Purple dashed: rustos PR #6 or an open cw-message-gateway PR, not merged.</text>

  <!-- frames -->
  <rect x="12" y="100" width="200" height="656" rx="6" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="12" y="100" width="150" height="28" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="24" y="119" font-size="14" font-weight="bold">api: portable</text>
  <rect x="292" y="100" width="416" height="656" rx="6" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="292" y="100" width="190" height="28" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="304" y="119" font-size="14" font-weight="bold">pico2: chip-specific</text>

  <!-- row 1: common -->
  <rect x="20" y="140" width="184" height="114" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="112" y="166" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::common</text>
  <text x="112" y="192" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ErrorType</text>
  <text x="112" y="212" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Read&lt;T&gt;</text>
  <text x="112" y="232" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Write&lt;T&gt;</text>
  <rect x="300" y="140" width="400" height="114" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="312" y="164" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350GpioIn&lt;N&gt;: Read&lt;bool&gt;</text>
  <text x="312" y="182" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350GpioOut&lt;N&gt;: Write&lt;bool&gt;</text>
  <text x="312" y="200" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350PwmSquare&lt;N&gt;: Write&lt;bool&gt;</text>
  <text x="312" y="218" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Usb: Read&lt;u8&gt;, Write&lt;u8&gt;</text>
  <text x="312" y="236" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Gpio, Rp2350Pwm: ErrorType</text>
  <line x1="298" y1="197" x2="206" y2="197" stroke="#374151" stroke-width="2" marker-end="url(#a03dp-arrow)"/>
  <text x="252" y="187" text-anchor="middle" font-size="13">implement</text>

  <!-- row 2: device -->
  <rect x="20" y="270" width="184" height="132" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="112" y="296" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::device</text>
  <text x="112" y="322" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PinHandle&lt;N&gt;</text>
  <text x="112" y="342" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DeviceHandle&lt;T&gt;</text>
  <text x="112" y="362" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">define_board!</text>
  <rect x="300" y="270" width="400" height="132" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="312" y="294" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">board.rs: define_board! → Rp2350</text>
  <text x="312" y="312" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">PinHandle&lt;N&gt; taken by</text>
  <text x="328" y="330" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Gpio::{input,output}_from_handle</text>
  <text x="328" y="348" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Pwm::square_from_handle</text>
  <text x="328" y="366" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Adc::stream_from_handle</text>
  <text x="312" y="384" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DeviceHandle&lt;T&gt;: all 9 drivers' new</text>
  <line x1="298" y1="336" x2="206" y2="336" stroke="#374151" stroke-width="2" marker-end="url(#a03dp-arrow)"/>
  <text x="252" y="308" text-anchor="middle" font-size="13">invoke,</text>
  <text x="252" y="326" text-anchor="middle" font-size="13">consume</text>

  <!-- row 3: gpio -->
  <rect x="20" y="418" width="184" height="104" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="112" y="444" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::gpio</text>
  <text x="112" y="468" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Gpio, Pull</text>
  <text x="112" y="488" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">GpioPinIn&lt;N&gt;</text>
  <text x="112" y="508" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">GpioPinOut&lt;N&gt;</text>
  <rect x="300" y="418" width="400" height="104" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="312" y="444" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Gpio: Gpio, Error = GpioError</text>
  <text x="312" y="462" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Input&lt;N&gt; = Rp2350GpioIn&lt;N&gt;</text>
  <text x="312" y="480" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Output&lt;N&gt; = Rp2350GpioOut&lt;N&gt;</text>
  <text x="312" y="504" font-size="13" fill="#4b5563">the output pin offers no Read&lt;bool&gt; read-back</text>
  <line x1="298" y1="470" x2="206" y2="470" stroke="#374151" stroke-width="2" marker-end="url(#a03dp-arrow)"/>
  <text x="252" y="460" text-anchor="middle" font-size="13">implement</text>

  <!-- row 4: usb -->
  <rect x="20" y="538" width="184" height="104" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="112" y="564" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::usb</text>
  <text x="112" y="588" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ControlHandler</text>
  <text x="112" y="608" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ByteRing&lt;N&gt;</text>
  <text x="112" y="628" text-anchor="middle" font-size="14">descriptors, ZLP rules</text>
  <rect x="300" y="538" width="400" height="104" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="312" y="564" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Usb (usb/mod.rs, usb/hw.rs)</text>
  <text x="312" y="584" font-size="13">owns a ControlHandler and two ByteRing&lt;512&gt;</text>
  <text x="312" y="604" font-size="13">runs every stage, applies each Effect</text>
  <text x="312" y="624" font-size="13">re-exports UsbDeviceConfig for applications</text>
  <line x1="298" y1="590" x2="206" y2="590" stroke="#374151" stroke-width="2" marker-end="url(#a03dp-arrow)"/>
  <text x="252" y="580" text-anchor="middle" font-size="13">use</text>

  <!-- row 5: multicore (PR #6) -->
  <rect x="20" y="658" width="184" height="86" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="112" y="684" text-anchor="middle" font-size="15" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::multicore</text>
  <text x="112" y="708" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Mailbox, Launch,</text>
  <text x="112" y="728" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Step</text>
  <rect x="300" y="658" width="400" height="86" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="312" y="684" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Fifo: Mailbox (the SIO FIFO registers)</text>
  <text x="312" y="704" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Core1::launch steps a Launch</text>
  <text x="312" y="726" font-size="13" fill="#4b5563">rustos PR #6 at 410dffa (open)</text>
  <line x1="298" y1="704" x2="206" y2="704" stroke="#374151" stroke-width="2" marker-end="url(#a03dp-arrow)"/>
  <text x="252" y="676" text-anchor="middle" font-size="13">implement,</text>
  <text x="252" y="694" text-anchor="middle" font-size="13">use</text>

  <!-- applications -->
  <line x1="120" y1="790" x2="120" y2="760" stroke="#374151" stroke-width="2" marker-end="url(#a03dp-arrow)"/>
  <text x="134" y="782" font-size="13">name api items directly</text>
  <rect x="12" y="792" width="696" height="294" rx="6" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="380" y="792" width="328" height="28" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="392" y="811" font-size="14" font-weight="bold">applications outside rustos</text>

  <rect x="20" y="832" width="332" height="118" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="34" y="856" font-size="15" font-weight="bold">Keyer box, gateway main</text>
  <text x="34" y="878" font-size="14">rustos 8c91507</text>
  <text x="34" y="900" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::common::{Read, Write}</text>
  <text x="34" y="920" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::gpio::{Gpio, Pull}</text>
  <text x="34" y="940" font-size="13" fill="#4b5563">USB config through pico2::usb</text>

  <rect x="368" y="832" width="332" height="118" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="382" y="856" font-size="15" font-weight="bold">Decoder box, PR #30 (open)</text>
  <text x="382" y="878" font-size="14">rustos 80bf599 (master)</text>
  <text x="382" y="900" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::gpio::Gpio</text>
  <text x="382" y="920" font-size="13" fill="#4b5563">USB config through pico2::usb</text>

  <rect x="20" y="960" width="332" height="118" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="34" y="984" font-size="15" font-weight="bold">One-Pico keyer, PR #31 (draft)</text>
  <text x="34" y="1006" font-size="14">rustos 410dffa (rustos PR #6)</text>
  <text x="34" y="1028" font-size="13">as the keyer box, plus</text>
  <text x="34" y="1048" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::device::PinHandle</text>
  <text x="34" y="1068" font-size="13" fill="#4b5563">core 1 through pico2::multicore</text>

  <rect x="368" y="960" width="332" height="118" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="382" y="984" font-size="15" font-weight="bold">New app from templates/pico2</text>
  <text x="382" y="1006" font-size="14">no pin: rustos default branch</text>
  <text x="382" y="1028" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::common::Write</text>
  <text x="382" y="1048" font-size="13" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">api::gpio::Gpio</text>

  <!-- legend -->
  <rect x="20" y="1104" width="22" height="16" fill="#dcfce7" stroke="#166534"/>
  <text x="50" y="1118" font-size="14">firmware code</text>
  <rect x="180" y="1104" width="22" height="16" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/>
  <text x="210" y="1118" font-size="14">not merged (open PR)</text>
  <rect x="390" y="1104" width="22" height="16" fill="none" stroke="#374151" stroke-dasharray="4 3"/>
  <text x="420" y="1118" font-size="14">crate or group boundary</text>
  <text x="20" y="1152" font-size="14" fill="#4b5563">A rustos change reaches an application only when its Cargo.toml pin moves.</text>
</svg>
