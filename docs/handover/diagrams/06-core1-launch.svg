<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1336" width="720" height="1336" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" fill="#111827">
  <title>Sequence of the core 1 launch: core 0 drains the FIFO from core 1, wakes core 1 and waits 100 microseconds before each 0, then sends 0, 0, 1, the vector table, the stack pointer and the entry point, each echoed back by core 1's bootrom; a wrong echo restarts the sequence and a time limit ends the attempt</title>
  <defs>
    <marker id="c06l-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="1336" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="bold">Starting core 1: the launch handshake</text>
  <text x="24" y="60" font-size="14" fill="#4b5563">Each word as Rp2350Core1::launch sends it (rustos PR #6, untested on hardware)</text>

  <g transform="translate(4,0)">
    <!-- participants -->
    <rect x="20" y="78" width="220" height="74" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="130" y="102" text-anchor="middle" font-weight="bold">Core 0</text>
    <text x="130" y="122" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Core1::launch</text>
    <text x="130" y="140" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">calls Launch::step</text>

    <rect x="262" y="78" width="196" height="74" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
    <text x="360" y="102" text-anchor="middle" font-weight="bold">SIO FIFOs</text>
    <text x="360" y="122" text-anchor="middle" font-size="14">0→1 and 1→0</text>
    <text x="360" y="140" text-anchor="middle" font-size="14">4 words each (§3.1.5)</text>

    <rect x="480" y="78" width="220" height="74" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
    <text x="590" y="102" text-anchor="middle" font-weight="bold">Core 1 bootrom</text>
    <text x="590" y="122" text-anchor="middle" font-size="14">"Core 1 Wait" step</text>
    <text x="590" y="140" text-anchor="middle" font-size="14">datasheet §5.2, §5.3</text>

    <!-- lifelines (broken where a note sits on them) -->
    <g stroke="#374151" stroke-width="2" stroke-dasharray="5 6" fill="none">
      <line x1="130" y1="152" x2="130" y2="278"/>
      <line x1="130" y1="326" x2="130" y2="426"/>
      <line x1="130" y1="466" x2="130" y2="902"/>
      <line x1="360" y1="152" x2="360" y2="902"/>
      <line x1="590" y1="152" x2="590" y2="902"/>
    </g>

    <!-- frame: before each 0 -->
    <rect x="12" y="166" width="688" height="170" rx="6" fill="none" stroke="#374151" stroke-width="1.5"/>
    <rect x="12" y="166" width="140" height="26" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="82" y="184" text-anchor="middle" font-size="14" font-weight="bold">before each 0</text>

    <text x="245" y="208" text-anchor="middle" font-size="14">drain: read FIFO_RD</text>
    <text x="245" y="226" text-anchor="middle" font-size="14">while VLD (max 16 a step)</text>
    <line x1="358" y1="234" x2="134" y2="234" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>

    <text x="245" y="264" text-anchor="middle" font-size="14">SEV: wake core 1</text>
    <text x="475" y="264" text-anchor="middle" font-size="14" fill="#4b5563">an event, no word</text>
    <line x1="132" y1="272" x2="586" y2="272" stroke="#374151" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#c06l-arrow)"/>

    <rect x="24" y="284" width="304" height="42" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="176" y="301" text-anchor="middle" font-size="14">FIFO 1→0 must read empty for</text>
    <text x="176" y="319" text-anchor="middle" font-size="14">100 µs (QUIET_US), then send 0</text>

    <!-- word 1 -->
    <text x="245" y="364" text-anchor="middle">word 1: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</tspan></text>
    <line x1="132" y1="372" x2="586" y2="372" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="372" r="4" fill="#374151"/>
    <text x="475" y="396" text-anchor="middle" font-size="14">echo 0</text>
    <line x1="588" y1="404" x2="134" y2="404" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="404" r="4" fill="#374151"/>

    <!-- second 0: drain again -->
    <rect x="24" y="426" width="304" height="40" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="176" y="451" text-anchor="middle" font-size="14">again: drain, SEV, 100 µs quiet</text>

    <!-- word 2 -->
    <text x="245" y="494" text-anchor="middle">word 2: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</tspan></text>
    <line x1="132" y1="502" x2="586" y2="502" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="502" r="4" fill="#374151"/>
    <text x="475" y="526" text-anchor="middle" font-size="14">echo 0</text>
    <line x1="588" y1="534" x2="134" y2="534" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="534" r="4" fill="#374151"/>

    <!-- word 3 -->
    <text x="245" y="566" text-anchor="middle">word 3: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1</tspan></text>
    <line x1="132" y1="574" x2="586" y2="574" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="574" r="4" fill="#374151"/>
    <text x="475" y="598" text-anchor="middle" font-size="14">echo 1</text>
    <line x1="588" y1="606" x2="134" y2="606" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="606" r="4" fill="#374151"/>

    <!-- word 4 -->
    <text x="245" y="638" text-anchor="middle">word 4: vector table</text>
    <text x="245" y="656" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&amp;VECTOR_TABLE</text>
    <line x1="132" y1="664" x2="586" y2="664" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="664" r="4" fill="#374151"/>
    <text x="475" y="688" text-anchor="middle" font-size="14">echo of word 4</text>
    <line x1="588" y1="696" x2="134" y2="696" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="696" r="4" fill="#374151"/>

    <!-- word 5 -->
    <text x="245" y="728" text-anchor="middle">word 5: stack pointer</text>
    <text x="245" y="746" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">stack.range().end</text>
    <line x1="132" y1="754" x2="586" y2="754" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="754" r="4" fill="#374151"/>
    <text x="475" y="778" text-anchor="middle" font-size="14">echo of word 5</text>
    <line x1="588" y1="786" x2="134" y2="786" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="786" r="4" fill="#374151"/>

    <!-- word 6 -->
    <text x="245" y="818" text-anchor="middle">word 6: entry point</text>
    <text x="245" y="836" text-anchor="middle" font-size="14"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1_start</tspan> (Thumb bit set)</text>
    <line x1="132" y1="844" x2="586" y2="844" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="844" r="4" fill="#374151"/>
    <text x="475" y="868" text-anchor="middle" font-size="14">echo of word 6, the last</text>
    <line x1="588" y1="876" x2="134" y2="876" stroke="#374151" stroke-width="2" marker-end="url(#c06l-arrow)"/>
    <circle cx="360" cy="876" r="4" fill="#374151"/>

    <!-- end states -->
    <rect x="24" y="902" width="212" height="50" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="130" y="922" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Step::Launched</text>
    <text x="130" y="941" text-anchor="middle" font-size="14">launch returns <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Ok(Fifo)</tspan></text>

    <rect x="480" y="902" width="220" height="50" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
    <text x="590" y="922" text-anchor="middle" font-size="14">sets SP and VTOR, then</text>
    <text x="590" y="941" text-anchor="middle" font-size="14">jumps to <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">core1_start</tspan></text>

    <!-- rules -->
    <rect x="20" y="976" width="680" height="174" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="36" y="1002" font-weight="bold">Step rules: each <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Launch::step</tspan> returns at once</text>
    <text x="36" y="1028" font-size="14">• The echo is not the word sent: start over from word 1 (drain, SEV, quiet).</text>
    <text x="36" y="1050" font-size="14">• FIFO 0→1 full (RDY = 0): nothing is sent; the same word is tried next step.</text>
    <text x="36" y="1072" font-size="14">• No echo yet: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Step::Pending</tspan>; the caller steps again.</text>
    <text x="36" y="1094" font-size="14">• Any word read during the quiet wait restarts the 100 µs.</text>
    <text x="36" y="1116" font-size="14">• Every word written to FIFO_WR is followed by SEV, so core 1 is woken each time.</text>
    <text x="36" y="1138" font-size="14" fill="#4b5563">Only a 0 drains and waits: words 3 to 6 go out as soon as the previous echo is in.</text>

    <rect x="20" y="1162" width="680" height="118" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="36" y="1188" font-weight="bold">Time limit: in <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Rp2350Core1::launch</tspan></text>
    <text x="36" y="1214" font-size="14">• After every Pending step: elapsed &gt; <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">timeout_us</tspan> returns <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Err(NoAnswer)</tspan>.</text>
    <text x="36" y="1236" font-size="14">• About 200 µs on a waiting core 1 (model); the keyer image allows 10 ms.</text>
    <text x="36" y="1258" font-size="14">• If word 6 went out but its echo is late, core 1 may still start after <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">NoAnswer</tspan>.</text>

    <!-- legend -->
    <rect x="20" y="1300" width="18" height="14" fill="#ede9fe" stroke="#5b21b6" stroke-dasharray="4 3"/>
    <text x="46" y="1312" font-size="14">rustos PR #6 code (not on master)</text>
    <rect x="320" y="1300" width="18" height="14" fill="#fef3c7" stroke="#92400e"/>
    <text x="346" y="1312" font-size="14">chip hardware and bootrom</text>
    <circle cx="580" cy="1307" r="4" fill="#374151"/>
    <text x="592" y="1312" font-size="14">via a FIFO</text>
  </g>
</svg>
