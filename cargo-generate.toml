# Marks this repo as a cargo-generate template source. Each supported board
# is a sub-template under templates/, and templates/app is an application
# module for an existing crate; running plain
#
#   cargo generate --git https://github.com/robinonsay/rustos
#
# prompts for which template, or pick one directly:
#
#   cargo generate --git https://github.com/robinonsay/rustos templates/pico2
[template]
sub_templates = ["templates/pico2", "templates/app"]
